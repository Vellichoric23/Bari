.gift .bow:before,.gift .bow:after{content:"";position:absolute;top:0;width:28px;height:26px;border:7px solid #FFD166;border-radius:50% 50% 0 50%}
.gift .bow:before{left:0;transform:rotate(-20deg)}.gift .bow:after{right:0;transform:rotate(110deg)}

async function seatSecret(gk,name,k){return k?("k:"+k):("n:"+gk+"|"+String(name||"").trim().toLowerCase().replace(/\s+/g," "));}
async function seatId(sec){return _hex(await crypto.subtle.digest("SHA-256",_te.encode("id|"+sec))).slice(0,16);}
async function seatKey(sec){const raw=await crypto.subtle.digest("SHA-256",_te.encode("key|"+sec));return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);}
async function sealTo(sec,to){const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await seatKey(sec),_te.encode(to));return _b64(iv)+"."+_b64(c);}
async function openTo(sec,box){try{const [a,b]=box.split(".");const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:_ub64(a)},await seatKey(sec),_ub64(b));return new TextDecoder().decode(p);}catch(e){return null;}}

  return {wrap,add:pick(adds),add2:pick(adds),twist,style:pick(STYLES)};}
function ideaHtml(it,i){const d=giftIdea(it.t+" "+(it.no||""));return `<div class="idea" id="idea${i}"><p><b>🎀 Упаковка:</b> ${esc(d.wrap)}</p><p><b>➕ Добавь к подарку:</b> ${esc(d.add)}${d.add2!==d.add?` или ${esc(d.add2)}`:""}</p><p><b>✨ Изюминка:</b> ${esc(d.twist)}</p><button class="x more" data-more="${i}">Ещё идея ↻</button></div>`;}
async function syncGame(g,gk){try{const r=await rpc("get_game",{p_game:gk});const d=r&&r.data;if(!d)return;
    let to=g.to;if(d.a){const sec=await seatSecret(gk,g.me,g.k);const box=d.a[await seatId(sec)];if(box){const v=await openTo(sec,box);if(v)to=v;}}
    const seen=LS.get("bari-play-to-"+gk+"|"+norm(g.me)), redrawn=seen&&seen!==to;
    if(redrawn){LS.set("bari-play-open-"+enc([g.ti,g.me]).slice(0,40),null);}
    const cur=window._shown||g; const ch=to!==cur.to||(d.d&&d.d!==cur.d)||(d.b&&d.b!==cur.b)||(d.no!==undefined&&d.no!==cur.no);
    if(ch||redrawn) game({...g,_live:1,_gk:gk,_old:g.d,_redrawn:redrawn,to,d:d.d||g.d,b:d.b||g.b,no:d.no!==undefined?d.no:g.no});
  }catch(e){}}
setInterval(()=>{const h=location.hash.slice(1);if(!document.hidden&&h.startsWith("g=")){const g=dec(h.slice(2));if(g)syncGame(g,gameKey(g));}},45000);
async function loadTheirs(g,gk){window._twG=[g,gk];const box=$("#twBody");if(!box)return;
  try{const r=await rpc("get_wish",{p_game:gk,p_person:norm(g.to)});const w=r&&r.data;
    if(!w||(!w.wish&&!(w.items||[]).length)){box.innerHTML=`<p class="muted">${esc(g.to)} ещё не написал(а) вишлист. Загляни позже — список появится здесь сам.</p>`;return;}
    const at=r.at?new Date(r.at).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
    box.innerHTML=`${w.wish?`<p style="font-size:17px;font-weight:700;margin:4px 0">${esc(w.wish)}</p>`:""}${(w.items||[]).map((it,i)=>`<div class="it" style="flex-wrap:wrap"><div style="flex:1"><b>${esc(it.t)}</b>${it.p?` · ${esc(it.p)}`:""}${it.u?`<br><a href="${esc(it.u)}" target="_blank" rel="noopener">посмотреть</a>`:""}</div><button class="x ib" data-idea="${i}">💡 Идеи</button><div class="idea-slot" id="slot${i}" style="width:100%"></div></div>`).join("")}${w.wish?`<div class="it" style="flex-wrap:wrap"><div style="flex:1"><b>Главное желание:</b> ${esc(w.wish)}</div><button class="x ib" data-idea="w">💡 Идеи</button><div class="idea-slot" id="slotw" style="width:100%"></div></div>`:""}${at?`<p class="muted" style="font-size:12px">обновлено ${esc(at)}</p>`:""}`;
    const items=[...(w.items||[])];const byKey=k=>k==="w"?{t:w.wish}:items[+k];
    const open=(k)=>{const slot=$("#slot"+k);if(!slot)return;slot.innerHTML=ideaHtml(byKey(k),k);const m=slot.querySelector("[data-more]");if(m)m.onclick=()=>{open(k);pop();};};
    box.querySelectorAll("[data-idea]").forEach(b=>b.onclick=()=>{const k=b.dataset.idea,slot=$("#slot"+k);if(slot.innerHTML){slot.innerHTML="";return;}open(k);pop();});
  }catch(e){box.innerHTML=`<p class="muted">Живой вишлист скоро заработает. А пока попроси ${esc(g.to)} отправить вишлист в общий чат.</p>`;}}
function wish(w){LIVE=null;window._shown=null;app.innerHTML=`<div class="bari">${BH}</div><span class="label">Вишлист</span><h1>${esc(w.n||"Друг")} мечтает о…</h1>
  ${w.wish?`<div class="card"><span class="label">Главное желание</span><p style="font-size:18px;font-weight:700;margin:4px 0">${esc(w.wish)}</p></div>`:""}
  <div class="card">${(w.items||[]).map(it=>`<div class="it"><div><b>${esc(it.t)}</b>${it.p?` · ${esc(it.p)}`:""}${it.u?`<br><a href="${esc(it.u)}" target="_blank" rel="noopener">посмотреть</a>`:""}${it.no?`<br><span class="muted">${esc(it.no)}</span>`:""}</div></div>`).join("")||`<p class="muted">Список пока пуст.</p>`}</div>
  <a class="btn ghost" href="${base}#new">Создать свой вишлист</a><footer><a href="./">BARI — планер и путешествия каждый день</a></footer>`;}
function home(){LIVE=null;window._shown=null;WKEY="bari-play-wish";app.innerHTML=`<div class="bari">${BJ}</div><h1>Праздники с близкими</h1><p class="muted">Здесь открываются тайные игры и вишлисты из BARI.</p>${wishEditor("")}<footer><a href="./">Открыть BARI</a></footer>`;bindWish();}
function route(){const h=location.hash.slice(1);if(h.startsWith("g=")){const g=dec(h.slice(2));if(g&&g.me&&g.to)return game(g);}if(h.startsWith("w=")){const w=dec(h.slice(2));if(w)return wish(w);}home();}
window.addEventListener("hashchange",route);route();
})();
</script></body></html>
