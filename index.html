  kid:"Нарисуйте вместе семейное дерево: мама, папа, бабушки, дедушки — и кто был до них."},
 {id:"bata",kz:"Бата",ru:"Благословение",g:"heart",
  tk:"Бата — үлкен адамның ізгі ниетпен айтатын тілегі. Ас ішіп болғанда, сапарға шығарда, игі істің басында бата сұралады. «Батаменен ер көгереді» дейді халық. Бата берген соң алақанды бетке сипау — тілекті қабыл алудың белгісі.",
  tr:"Бата — благословение, которое произносит старший. Его просят после трапезы, перед дорогой, в начале важного дела. «Благословение растит человека», — говорят в народе. Провести ладонями по лицу после баты — значит принять пожелание."},
 {id:"nauryz",kz:"Наурыз",ru:"Праздник весеннего равноденствия",g:"flower",
  tk:"Наурыз — көктемгі күн мен түннің теңелуіне орай тойланатын жыл басы. Қазақстанда ол 21–23 наурызда аталып өтеді. Басты тағамы — жеті түрлі өнімнен әзірленетін наурыз көже. Бұл күні адамдар бір-біріне «Ұлыстың ұлы күні құтты болсын!» деп тілек айтады, өкпе-реніштерін ұмытады.",
  tr:"Наурыз — Новый год по древнему календарю, праздник весеннего равноденствия. В Казахстане его отмечают 21–23 марта. Главное блюдо — наурыз көже из семи продуктов. В этот день говорят «Ұлыстың ұлы күні құтты болсын!» и забывают старые обиды."}
 ]},
{id:"qazyna",kz:"Жеті қазына",ru:"Семь сокровищ",g:"mountain",
 ik:"Көшпелі қазақ жеті қазынаны бақуатты өмірдің негізі санаған. Халық арасында тізімнің бірнеше нұсқасы бар; ең жиі айтылатыны мынау: ер жігіт, сұлу әйел, жүйрік ат, қыран бүркіт, құмай тазы, берен мылтық, қанды ауыз қақпан.",
 ir:"Кочевники считали «семь сокровищ» основой достойной жизни. Вариантов списка несколько; чаще всего называют: отважный джигит, красивая (мудрая) жена, быстрый конь, беркут, борзая тазы, надёжное ружьё и капкан. Это портрет жизни в степи, где всё держалось на защите рода, семье и охоте.",
 c:[
 {id:"q-er",kz:"Ер жігіт",ru:"Отважный мужчина",g:"mountain",
  tk:"Ер жігіт — елінің қорғаны, сөзіне берік, намысты адам. «Ер жігіт елі үшін туады, елі үшін өледі» дейді халық. Халық оның тек күшін емес, әділдігін, сабырын, үлкенге құрмет, кішіге ізет көрсете білуін де бағалаған.",
  tr:"Ер жігіт — защитник своего народа, человек слова и чести. «Джигит рождается для народа и за народ умирает», — говорили в степи. Ценили не только силу, но и справедливость, выдержку, уважение к старшим и заботу о младших."},
 {id:"q-aiel",kz:"Сұлу әйел",ru:"Красивая жена",g:"flower",
  tk:"Мұндағы сұлулық тек сырт келбет емес: ақылды, инабатты, шаңырақтың берекесін ұстап отырған ана. Отбасының ынтымағы мен балалардың тәрбиесі көбіне соның қолында болған.",
  tr:"Красота здесь — не только внешность: это умная, тактичная хозяйка, на которой держится благополучие дома. От неё во многом зависели лад в семье и воспитание детей."},
 {id:"q-at",kz:"Жүйрік ат",ru:"Быстрый конь",g:"bus",
  tk:"«Ат — ердің қанаты» дейді қазақ. Жүйрік ат көшпелі өмірде жол серігі де, жауға қарсы тұрар сенімді тірек те болған. Бәйгеде озған ат иесіне ғана емес, бүкіл ауылға абырой әкелген, жүйрік аттардың аты ел аузында аңызға айналған.",
  tr:"«Конь — крылья джигита». Быстрый конь был и спутником в дороге, и опорой в бою. Победа на скачках — бәйге — приносила славу не только хозяину, но и всему аулу, а имена знаменитых скакунов становились легендами."},
 {id:"q-burkit",kz:"Қыран бүркіт",ru:"Беркут",g:"mountain",
  tk:"Бүркітпен аң аулау — саятшылық — қазақтың ежелгі өнері. Бүркітші балапанды қолға үйретіп, жылдар бойы баулиды. Қыран түлкі мен қасқырды да ала алады. Бүркітті сыйлау, оны белгілі бір жастан кейін табиғатқа қайта жіберу дәстүрі де болған.",
  tr:"Охота с беркутом — саятшылық — древнее искусство казахов. Беркутчи годами приручает и обучает птицу; хороший беркут берёт лису и даже волка. Существовала и традиция отпускать птицу на волю, когда она отслужила своё."},
 {id:"q-tazy",kz:"Құмай тазы",ru:"Борзая тазы",g:"tree",
  tk:"Тазы — қазақтың ежелгі аңшы иті, өте жүйрік әрі ақылды. Оны үйге кіргізуге рұқсат етілген, тазы күшігін бағалы сыйлық ретінде берген. Аңшының тазысы бүкіл отбасын асырауға көмектескен.",
  tr:"Тазы — древняя казахская борзая, очень быстрая и умная. В отличие от других собак, её пускали в дом, а щенок тазы считался ценным подарком. Охотничья тазы помогала прокормить всю семью."},
 {id:"q-myltyq",kz:"Берен мылтық",ru:"Надёжное ружьё",g:"column",
  tk:"«Берен» — жоғары сапалы болаттың атауы. Берен мылтық — аңшы мен жауынгердің сенімді қаруы. Мерген атанған адамды ел ерекше құрметтеген, оның олжасы ауылдың азығына айналған.",
  tr:"«Берен» — название высококачественной стали. Берен мылтық — надёжное оружие охотника и воина. Меткого стрелка — мерген — особенно уважали: его добыча кормила аул."},
 {id:"q-qaqpan",kz:"Қанды ауыз қақпан",ru:"Капкан",g:"mountain",
  tk:"Қақпан — аңшылықтың маңызды құралы. Ол қыста қасқыр мен түлкіні аулап, малды жыртқыштан қорғауға көмектескен. Тізімдегі бұл қазына көшпелілердің тұрмысы табиғатпен тығыз байланысты болғанын көрсетеді.",
  tr:"Капкан — важное орудие охоты. Зимой с его помощью ловили волков и лис и защищали скот от хищников. То, что капкан вошёл в список сокровищ, показывает, насколько жизнь кочевника зависела от степи и охоты."}
 ]},
{id:"epos",kz:"Эпостар мен аңыздар",ru:"Эпосы, мифы и легенды",g:"lantern",
 ik:"Қазақ эпосы ғасырлар бойы ауыздан-ауызға жырау мен жыршылар арқылы жеткен. Батырлық жырлар елдің ерлігін, ғашықтық жырлар махаббат пен адалдықты жырлайды. Аңыздар мен мифтерде халықтың әлем туралы түсінігі сақталған.",
 ir:"Казахский эпос веками передавался из уст в уста — его исполняли жырау и жыршы. Героические поэмы воспевают подвиги, лиро-эпические — любовь и верность. В легендах и мифах сохранилось древнее представление народа о мире.",
 c:[
 {id:"alpamys",kz:"Алпамыс батыр",ru:"Героический эпос",g:"mountain",
  tk:"Алпамыс — түркі халықтарына ортақ батырлық жырдың кейіпкері. Ол сүйген жары Гүлбаршынға үйленіп, елін жаудан қорғайды. Қалмақ ханы Тайшықтың тұтқынында көп жыл зынданда отырып, хан қызы Қаракөздің көмегімен босайды. Еліне жасырын оралып, отбасы мен ауылын қорлықтан құтқарады.",
  tr:"Алпамыс — герой эпоса, общего для многих тюркских народов. Он женится на любимой Гүлбаршын и защищает свой народ. Попав в плен к калмыцкому хану Тайшыку, годы проводит в зиндане и освобождается благодаря ханской дочери Қаракөз. Вернувшись домой неузнанным, он спасает семью и аул от унижения."},
 {id:"qobylandy",kz:"Қобыланды батыр",ru:"Героический эпос",g:"bus",
  tk:"Қобыланды — Қазан ханмен соғысқан батыр. Жырдағы ең жарқын бейненің бірі — оның ақылды жары Құртқа. Құртқа батырдың тұлпары Тайбурылды құлын кезінен баптап өсіреді, сондықтан ат жырда батырдың адал серігіне айналады. Жыр ерлік пен әйел даналығын қатар жырлайды.",
  tr:"Қобыланды — батыр, сражавшийся с Қазан-ханом. Одна из самых ярких фигур эпоса — его мудрая жена Құртқа: она с жеребёнка выхаживает его коня Тайбурыла, и конь становится верным спутником героя. Эпос воспевает рядом отвагу мужчины и мудрость женщины."},
 {id:"qyzzhibek",kz:"Қыз Жібек",ru:"Лиро-эпическая поэма",g:"flower",
  tk:"Төлеген мен Жібектің махаббаты туралы ғашықтық жыр. Төлеген Жібекке үйленуге ниет етіп, алыс жолға шығады, бірақ қастандықтың құрбаны болады. Кейін оның інісі Сансызбай Жібекті азат етеді. 1970 жылы Сұлтан-Ахмет Қожықов осы жыр бойынша «Қыз Жібек» фильмін түсірді.",
  tr:"Лиро-эпическая поэма о любви Төлегена и Жібек. Төлеген едет сватать Жібек в далёкий род, но гибнет от рук завистника. Позже его младший брат Сансызбай освобождает Жібек. В 1970 году Сұлтан-Ахмет Қожықов снял по поэме знаменитый фильм «Қыз Жібек»."},
 {id:"kozy",kz:"Қозы Көрпеш – Баян сұлу",ru:"Поэма о верности",g:"heart",
  tk:"Қозы Көрпеш пен Баян әкелерінің уәдесі бойынша туылмай жатып атастырылған. Бірақ Баянның әкесі Қарабай уәдесінен тайып, қызын басқаға бермек болады, ал Қодар екі жастың арасына кедергі болады. Жыр — адалдық пен шынайы махаббат туралы. Аягөз маңында «Қозы Көрпеш – Баян сұлу» кесенесі бар.",
  tr:"Қозы Көрпеш и Баян были обручены ещё до рождения по слову их отцов. Но отец Баян, Қарабай, нарушает обещание, а Қодар встаёт между влюблёнными. Поэма — о верности и настоящей любви. Недалеко от Аягоза стоит мавзолей «Қозы Көрпеш – Баян сұлу»."},
 {id:"qorqyt",kz:"Қорқыт ата",ru:"Легенда о вечной музыке",g:"lantern",
  tk:"Аңыз бойынша, Қорқыт ажалдан қашып, дүниенің төрт бұрышын кезеді, бірақ барған жерінің бәрінен «Қорқыттың көрі» деген сөзді естиді. Сонда Сырдарияның жағасына оралып, қобыз жасап, күй тартады: күй тынбаған кезде ажал оған жақындай алмаған екен. Қызылорда облысында Қорқыт атаға арналған кешен бар — ол жел соққанда сазды үн шығарады.",
  tr:"По легенде, Қорқыт бежал от смерти на все четыре стороны света, но всюду слышал: «Здесь могила Қорқыта». Тогда он вернулся на берег Сырдарьи, сделал қобыз и стал играть — пока звучала музыка, смерть не могла к нему подойти. В Кызылординской области стоит мемориал Қорқыт ата, который «поёт» на ветру."},
 {id:"zheruiyq",kz:"Асан қайғы және Жерұйық",ru:"Поиск земли счастья",g:"tree",
  tk:"Асан қайғы — халқына бақытты мекен іздеген ойшыл. Аңыз бойынша ол Желмаямен бүкіл даланы аралап, «Жерұйық» — жұрты аштық пен жоқшылық көрмейтін жерді іздеген. Оның жерлерге берген баға-сөздері ел аузында әлі айтылады.",
  tr:"Асан қайғы — мыслитель, искавший для народа счастливую землю. По легенде, он объездил всю степь на верблюдице Желмая в поисках Жерұйық — земли, где никто не знает голода и нужды. Его меткие слова о разных местностях до сих пор повторяют в народе."},
 {id:"samruk",kz:"Самұрық пен Бәйтерек",ru:"Птица счастья и древо жизни",g:"tree",
  tk:"Ежелгі аңыз бойынша, өмір ағашы Бәйтеректің басына Самұрық құс жыл сайын алтын жұмыртқа салады — ол күннің бейнесі. Айдаһар жұмыртқаны жұтып қойса, күн мен түн алмасады деген түсінік бар. Астанадағы «Бәйтерек» монументі осы аңыздың бейнесі ретінде салынған.",
  tr:"По древней легенде, на вершине Бәйтерека — дерева жизни — птица Самұрық каждый год откладывает золотое яйцо, символ солнца. Дракон проглатывает его, и так сменяются день и ночь. Монумент «Бәйтерек» в Астане построен как образ этой легенды."},
 {id:"umai",kz:"Ұмай ана",ru:"Покровительница матерей и детей",g:"heart",
  tk:"Көне түркілердің наным-сенімінде Ұмай ана — әйелдер мен балалардың қамқоршысы, ошақтың иесі. Оның аты Орхон-Енисей жазбаларында кездеседі. Халық арасында «Ұмай ана жар болсын» деген тілек бүгінге дейін сақталған.",
  tr:"В верованиях древних тюрков Ұмай ана — покровительница женщин, детей и домашнего очага. Её имя упоминается в древнетюркских орхоно-енисейских надписях. Пожелание «Пусть Ұмай ана хранит» дожило до наших дней."},
 {id:"aldar",kz:"Алдар Көсе",ru:"Хитрец из народных сказок",g:"bun",
  tk:"Алдар Көсе — қазақ ертегілерінің тапқыр кейіпкері. Ол сараң байлар мен мақтаншақтарды ақылмен алдап, жоқ-жітікке көмектеседі. Ең танымал ертегінің бірінде ол шық бермес Шығайбайды алдап, оның тонын алады.",
  tr:"Алдар Көсе — находчивый герой казахских сказок. Хитростью он обводит вокруг пальца жадных баев и хвастунов и помогает бедным. В одной из самых известных сказок он выманивает шубу у скупого Шығайбая.",
  kid:"Почитайте вместе сказку про Алдара Көсе и придумайте, как бы хитрец поступил сегодня."}
 ]},
{id:"alash",kz:"Алаш",ru:"Движение Алаш",g:"book2",
 ik:"Алаш қозғалысы — ХХ ғасыр басындағы қазақ зиялыларының ұлттық бостандық, білім мен мемлекеттілік үшін күресі. Оның көшбасшылары ағартушылық пен баспасөз арқылы халықты оятуға ұмтылды. Кеңес өкіметі тұсында олардың көбі қуғын-сүргінге ұшырап, есімдері ұзақ жылдар бойы айтылмай келді.",
 ir:"Алаш — движение казахской интеллигенции начала XX века за национальную свободу, образование и государственность. Его лидеры «будили» народ через газеты, школы и книги. В советское время большинство из них были репрессированы, и их имена десятилетиями замалчивались.",
 c:[
 {id:"alashorda",kz:"Алаш Орда",ru:"Национальное правительство 1917–1920",g:"yurt",
  tk:"1917 жылдың желтоқсанында Орынборда өткен Екінші жалпықазақ съезінде Алаш автономиясы жарияланып, оның үкіметі — Алаш Орда құрылды. Төрағасы болып Әлихан Бөкейхан сайланды. Алаш Орда 1920 жылы таратылды, алайда ол қазақтың ұлттық мемлекеттілігін қайта жаңғыртудың алғашқы тәжірибесі ретінде тарихта қалды.",
  tr:"В декабре 1917 года на Втором всеказахском съезде в Оренбурге провозгласили автономию Алаш и создали её правительство — Алаш Орду. Председателем избрали Әлихана Бөкейхана. В 1920 году Алаш Орду упразднили, но она осталась в истории как первая попытка возродить казахскую государственность в новое время."},
 {id:"qazaqgazeti",kz:"«Қазақ» газеті",ru:"Голос нации, 1913–1918",g:"book2",
  tk:"«Қазақ» газеті 1913–1918 жылдары Орынборда шықты. Оның редакторы Ахмет Байтұрсынұлы, ал тұрақты авторлары Әлихан Бөкейхан мен Міржақып Дулатұлы болды. Газет білім, жер мәселесі, ана тілі туралы жазып, Алаш идеясының басты мінберіне айналды.",
  tr:"Газета «Қазақ» выходила в Оренбурге в 1913–1918 годах. Её редактировал Ахмет Байтұрсынұлы, постоянно писали Әлихан Бөкейхан и Міржақып Дулатұлы. Газета поднимала вопросы образования, земли и родного языка и стала главной трибуной идей Алаша."},
 {id:"bokeikhan",kz:"Әлихан Бөкейхан",ru:"Лидер Алаша (1866–1937)",g:"column",
  tk:"Әлихан Бөкейхан — Алаш қозғалысының көсемі, ғалым, публицист. Ол экономика, тарих, этнография бойынша еңбектер жазып, Мемлекеттік Думаның депутаты болды. Алаш Орда үкіметін басқарды. 1937 жылы атылды, кейін ақталды.",
  tr:"Әлихан Бөкейхан — лидер движения Алаш, учёный и публицист. Писал труды по экономике, истории и этнографии, был депутатом Государственной думы, возглавил правительство Алаш Орда. Расстрелян в 1937 году, позже реабилитирован."},
 {id:"baitursyn",kz:"Ахмет Байтұрсынұлы",ru:"«Ұлт ұстазы» (1872–1937)",g:"book2",
  tk:"Ахмет Байтұрсынұлы — ағартушы, тілші ғалым, ақын. Ол араб жазуын қазақ тілінің дыбыстық жүйесіне бейімдеп, «төте жазуды» жасады, «Оқу құралы» әліппесі мен «Тіл құралы» оқулықтарын жазды. «Маса» өлеңдер жинағы халықты оянуға шақырды. Халқы оны «Ұлт ұстазы» деп атайды. 1937 жылы атылды.",
  tr:"Ахмет Байтұрсынұлы — просветитель, лингвист и поэт. Он приспособил арабское письмо к звукам казахского языка (төте жазу), написал букварь «Оқу құралы» и учебники грамматики «Тіл құралы». Его сборник «Маса» («Комар») призывал народ проснуться. Его называют «учителем нации». Расстрелян в 1937 году."},
 {id:"dulatuly",kz:"Міржақып Дулатұлы",ru:"«Оян, қазақ!» (1885–1935)",g:"lantern",
  tk:"Міржақып Дулатұлы — ақын, жазушы, публицист. 1909 жылы шыққан «Оян, қазақ!» жинағы бүкіл елге ұран болды. Оның «Бақытсыз Жамал» романы қазақ әдебиетіндегі алғашқы романдардың бірі саналады. Соловки лагерінде қайтыс болды.",
  tr:"Міржақып Дулатұлы — поэт, писатель, публицист. Его сборник «Оян, қазақ!» («Проснись, казах!», 1909) стал призывом для всего народа. Роман «Бақытсыз Жамал» считается одним из первых казахских романов. Умер в Соловецком лагере."},
 {id:"magzhan",kz:"Мағжан Жұмабаев",ru:"Поэт (1893–1938)",g:"flower",
  tk:"Мағжан Жұмабаев — қазақ поэзиясын жаңа биікке көтерген ақын. Оның өлеңдері нәзік әуенімен, бейнелілігімен ерекшеленеді. «Мен жастарға сенемін» өлеңі әлі күнге дейін жастардың ұранындай оқылады. Ол педагогика оқулығын да жазған. 1938 жылы атылды.",
  tr:"Мағжан Жұмабаев — поэт, поднявший казахскую поэзию на новую высоту: его стихи отличаются музыкальностью и образностью. Стихотворение «Мен жастарға сенемін» («Я верю в молодёжь») до сих пор читают как девиз. Он написал и учебник педагогики. Расстрелян в 1938 году."},
 {id:"aimautov",kz:"Жүсіпбек Аймауытұлы",ru:"Писатель (1889–1931)",g:"book2",
  tk:"Жүсіпбек Аймауытұлы — жазушы, драматург, педагог. «Ақбілек» романында қиын тағдырға тап болған қыздың рухани жаңаруын суреттеді, «Қартқожа» романында жастың білімге ұмтылысын көрсетті. 1931 жылы атылды.",
  tr:"Жүсіпбек Аймауытұлы — писатель, драматург, педагог. В романе «Ақбілек» он показал, как девушка, пережившая тяжёлую судьбу, находит силы жить дальше, а в «Қартқожа» — путь юноши к знаниям. Расстрелян в 1931 году."},
 {id:"shokai",kz:"Мұстафа Шоқай",ru:"Политик в эмиграции (1890–1941)",g:"column",
  tk:"Мұстафа Шоқай — Түркістан автономиясының көшбасшыларының бірі. Кеңес өкіметі орнағаннан кейін шетелге кетіп, Еуропада Түркістан халықтарының тәуелсіздігі туралы мақалалар жазып, журнал шығарды. 1941 жылы Берлинде қайтыс болды.",
  tr:"Мұстафа Шоқай — один из лидеров Туркестанской автономии. После установления советской власти эмигрировал и в Европе писал статьи и издавал журнал о свободе народов Туркестана. Умер в Берлине в 1941 году."},
 {id:"dosmukhamed",kz:"Жаһанша Досмұхамедұлы",ru:"Западная Алаш Орда (1887–1938)",g:"mountain",
  tk:"Жаһанша Досмұхамедұлы — заңгер, Алаш қайраткері. 1918 жылы ол Жымпитыда құрылған Алаш Орданың батыс бөлімшесін басқарды — бұл Батыс Қазақстан, оның ішінде Атырау өңірінің тарихымен тығыз байланысты. 1938 жылы атылды.",
  tr:"Жаһанша Досмұхамедұлы — юрист и деятель Алаша. В 1918 году он возглавил западное отделение Алаш Орды в Жымпиты — это история Западного Казахстана, в том числе и атырауского края. Расстрелян в 1938 году."}
 ]},
{id:"tulga",kz:"Ұлы тұлғалар",ru:"Великие люди",g:"book2",
 ik:"Қазақ даласынан әлемдік ғылым мен мәдениетке үлес қосқан тұлғалар көп шыққан. Олардың өмірі мен еңбегі — бүгінгі ұрпаққа үлгі.",
 ir:"Казахская степь дала миру учёных, поэтов, полководцев и музыкантов. Их жизнь и труды — пример для нынешнего поколения.",
 c:[
 {id:"farabi",kz:"Әбу Насыр әл-Фараби",ru:"«Второй учитель» (около 870–950)",g:"column",
  tk:"Әл-Фараби Сырдария бойындағы Отырар (Фараб) өңірінде дүниеге келген. Ол философия, логика, музыка, математика салаларында жүзден астам еңбек жазды. Аристотельден кейінгі «Екінші ұстаз» атанды. «Музыканың ұлы кітабы» — оның әйгілі еңбектерінің бірі.",
  tr:"Әл-Фараби родился в районе Отрара (Фараба) на Сырдарье. Он написал более сотни трудов по философии, логике, музыке и математике и получил прозвище «Второй учитель» — после Аристотеля. «Большая книга музыки» — один из его известнейших трудов."},
 {id:"abai",kz:"Абай Құнанбайұлы",ru:"Поэт и мыслитель (1845–1904)",g:"book2",
  tk:"Абай — қазақ жазба әдебиетінің негізін қалаушы, ақын, ойшыл, композитор. «Қара сөздерінде» білім, еңбек, адамгершілік туралы толғанды. Пушкин, Лермонтов, Крыловты қазақшаға аударды. «Көзімнің қарасы» сияқты әндері әлі күнге дейін шырқалады.",
  tr:"Абай — основоположник казахской письменной литературы, поэт, мыслитель и композитор. В «Словах назидания» (Қара сөздер) размышлял о знании, труде и человечности. Переводил на казахский Пушкина, Лермонтова, Крылова. Его песни, например «Көзімнің қарасы», поют до сих пор."},
 {id:"shokan",kz:"Шоқан Уәлиханов",ru:"Учёный и путешественник (1835–1865)",g:"boat",
  tk:"Шоқан — ғалым, тарихшы, этнограф, саяхатшы. 1858–1859 жылдары Қашқарияға жасырын сапар жасап, ол туралы еуропалық ғылымға алғаш рет толық мәлімет берді. «Манас» жырының бір бөлігін алғаш жазып алған да — Шоқан. Небәрі 29 жыл ғұмыр кешсе де, артында мол мұра қалдырды.",
  tr:"Шоқан — учёный, историк, этнограф и путешественник. В 1858–1859 годах он тайно побывал в Кашгарии и впервые дал европейской науке подробные сведения о ней. Он же первым записал часть киргизского эпоса «Манас». Прожил всего 29 лет, но оставил огромное наследие."},
 {id:"altynsarin",kz:"Ыбырай Алтынсарин",ru:"Просветитель (1841–1889)",g:"book2",
  tk:"Ыбырай Алтынсарин — ағартушы, педагог, жазушы. 1864 жылы Торғайда қазақ балаларына арналған мектеп ашты, кейін қыздарға арналған училище ашуға да ат салысты. Балаларға арналған әңгімелері мен өлеңдері «Қазақ хрестоматиясына» енді. «Кел, балалар, оқылық!» өлеңі — соның туындысы.",
  tr:"Ыбырай Алтынсарин — просветитель, педагог и писатель. В 1864 году открыл в Торгае школу для казахских детей, позже добился открытия училища для девочек. Его рассказы и стихи для детей вошли в «Казахскую хрестоматию». «Кел, балалар, оқылық!» («Давайте, дети, учиться!») — его стихотворение."},
 {id:"kurmangazy",kz:"Құрманғазы Сағырбайұлы",ru:"Композитор-кюйши (1823–1896)",g:"lantern",
  tk:"Құрманғазы — ұлы күйші, домбыраның хас шебері. «Сарыарқа», «Адай», «Балбырауын», «Кішкентай» күйлері — қазақ музыкасының інжу-маржаны. Еркін мінезі үшін талай рет қуғынға түсті. Қазақ ұлттық консерваториясы мен халық аспаптар оркестрі оның есімімен аталады.",
  tr:"Құрманғазы — великий кюйши, мастер домбры. Кюи «Сарыарқа», «Адай», «Балбырауын», «Кішкентай» — жемчужины казахской музыки. За свободолюбивый нрав он не раз подвергался преследованиям. Его имя носят Казахская национальная консерватория и оркестр народных инструментов."},
 {id:"auezov",kz:"Мұхтар Әуезов",ru:"Писатель (1897–1961)",g:"book2",
  tk:"Мұхтар Әуезов — жазушы, драматург, ғалым. Оның төрт кітаптан тұратын «Абай жолы» роман-эпопеясы Абайдың өмірі арқылы ХІХ ғасырдағы қазақ даласының бейнесін жасады және көптеген тілдерге аударылды. Ол «Еңлік – Кебек» пьесасын да жазған.",
  tr:"Мұхтар Әуезов — писатель, драматург и учёный. Его роман-эпопея «Путь Абая» в четырёх книгах через жизнь Абая показывает казахскую степь XIX века и переведён на многие языки. Он же автор пьесы «Еңлік – Кебек»."},
 {id:"satbayev",kz:"Қаныш Сәтбаев",ru:"Геолог (1899–1964)",g:"mountain",
  tk:"Қаныш Сәтбаев — геолог, Қазақ КСР Ғылым академиясының алғашқы президенті. Жезқазған өңіріндегі мыс кенін зерттеп, оның ірі кен орны екенін дәлелдеді. Оның есімімен Қазақ ұлттық техникалық университеті аталады.",
  tr:"Қаныш Сәтбаев — геолог, первый президент Академии наук Казахской ССР. Он исследовал медь Жезказгана и доказал, что это крупнейшее месторождение. Его имя носит Казахский национальный технический университет."},
 {id:"momyshuly",kz:"Бауыржан Момышұлы",ru:"Полководец (1910–1982)",g:"mountain",
  tk:"Бауыржан Момышұлы — 1941 жылы Мәскеуді қорғаған шайқастардың батыры, әскери қолбасшы және жазушы. Оның ерлігі Александр Бектің «Волоколамское шоссе» повесіне арқау болды. «Артымызда — Мәскеу» кітабының авторы. Кеңес Одағының Батыры атағы оған 1990 жылы берілді.",
  tr:"Бауыржан Момышұлы — герой обороны Москвы 1941 года, военачальник и писатель. Его подвиг лёг в основу повести Александра Бека «Волоколамское шоссе». Автор книги «За нами Москва». Звание Героя Советского Союза ему присвоили только в 1990 году, посмертно."},
 {id:"aliya",kz:"Әлия Молдағұлова",ru:"Снайпер (1925–1944)",g:"heart",
  tk:"Әлия Молдағұлова — мерген қыз, Ұлы Отан соғысының батыры. Ол небәрі 18 жасында майданда қаза тапты. Кеңес Одағының Батыры атағы оған қайтыс болғаннан кейін берілді. Қазақстанның көптеген қалаларында оның есімімен көшелер мен мектептер аталады.",
  tr:"Әлия Молдағұлова — снайпер, героиня Великой Отечественной войны. Погибла на фронте в 18 лет. Звание Героя Советского Союза присвоено посмертно. Её имя носят улицы и школы по всему Казахстану."},
 {id:"manshuk",kz:"Мәншүк Мәметова",ru:"Пулемётчица (1922–1943)",g:"heart",
  tk:"Мәншүк Мәметова — Батыс Қазақстан облысынан шыққан пулеметші қыз. Кеңес Одағының Батыры атағын алған алғашқы қазақ әйелі. 1943 жылы Невель қаласы маңындағы шайқаста қаза тапты.",
  tr:"Мәншүк Мәметова — пулемётчица родом из Западно-Казахстанской области, первая казашка — Герой Советского Союза. Погибла в 1943 году в боях под Невелем."},
 {id:"biler",kz:"Төле би, Қазыбек би, Әйтеке би",ru:"Три великих бия",g:"yurt",
  tk:"Үш би — Ұлы жүзден Төле би, Орта жүзден Қазыбек би, Кіші жүзден Әйтеке би — XVII–XVIII ғасырлардағы әйгілі шешендер мен әділ сот иелері. Халық оларды елдің бірлігін сақтаған дана ретінде құрметтейді. Тәуке ханның тұсындағы «Жеті жарғы» заңдар жинағы да солардың есімімен байланыстырылады.",
  tr:"Три бия — Төле би от Старшего жуза, Қазыбек би от Среднего и Әйтеке би от Младшего — знаменитые ораторы и справедливые судьи XVII–XVIII веков. Народ чтит их как мудрецов, сохранивших единство страны. С их именами связывают и свод законов «Жеті жарғы» времён Тәуке-хана."},
 {id:"abylai",kz:"Абылай хан",ru:"Хан и полководец (1711–1781)",g:"mountain",
  tk:"Абылай хан — XVIII ғасырдағы қазақ хандығының ірі мемлекет қайраткері әрі қолбасшысы. Ол жоңғар шапқыншылығына қарсы күресте ел бірлігін нығайтып, көрші мемлекеттермен ептілікпен келіссөз жүргізді. Оның ақылшысы әйгілі жырау Бұқар жырау болған.",
  tr:"Абылай хан — крупнейший государственный деятель и полководец Казахского ханства XVIII века. В борьбе с джунгарами он сплачивал народ и умело вёл переговоры с соседними державами. Его советником был знаменитый Бұқар жырау."},
 {id:"shamshi",kz:"Шәмші Қалдаяқов",ru:"Композитор (1930–1992)",g:"flower",
  tk:"Шәмші Қалдаяқов — халық «вальс королі» атаған сазгер. Оның «Менің Қазақстаным» әні (сөзін жазған Жұмекен Нәжімеденов) 2006 жылдан бері Қазақстан Республикасының Мемлекеттік әнұраны. «Арыс жағасында», «Ақ бантик» әндері де ел аузында.",
  tr:"Шәмші Қалдаяқов — композитор, которого в народе называют «королём вальса». Его песня «Менің Қазақстаным» (слова Жұмекена Нәжімеденова) с 2006 года — государственный гимн Казахстана. Его «Арыс жағасында» и «Ақ бантик» тоже знают все."}

{id:"oner",kz:"Өнер",ru:"Искусство",g:"yurt",

 {id:"dombyra",kz:"Домбыра",ru:"Двухструнный инструмент",g:"lantern",
  tk:"Домбыра — қазақтың басты ұлттық аспабы, оның екі ішегі бар. Күй тарту, ән сүйемелдеу, айтыс — бәрі домбырамен байланысты. «Нағыз қазақ — қазақ емес, нағыз қазақ — домбыра» деген Қадыр Мырза Әлидің сөзі осыдан. Қазақстанда шілденің бірінші жексенбісінде Домбыра күні аталып өтеді.",
  tr:"Домбра — главный казахский народный инструмент с двумя струнами. Кюи, песни, айтыс — всё связано с ней. Отсюда знаменитая строка Қадыра Мырза Әли: «Настоящий казах — не казах, настоящий казах — домбра». В Казахстане в первое воскресенье июля отмечают День домбры."},
 {id:"kui",kz:"Күй",ru:"История без слов",g:"mountain",
  tk:"Күй — сөзсіз, тек аспаппен орындалатын шығарма. Күйдің әрқайсысының өз тарихы, аңызы болады: күйші оны тартпас бұрын «бұл күй неге шықты» деп әңгімелеп береді. Күй шертпе және төкпе болып екі мектепке бөлінеді.",
  tr:"Күй — инструментальная пьеса без слов, которая рассказывает историю. Перед исполнением кюйши часто рассказывает легенду о том, как появился күй. Различают две школы: шертпе (щипковая, более лиричная) и төкпе (ударная, стремительная)."},
 {id:"aitys",kz:"Айтыс",ru:"Состязание поэтов",g:"tea",
  tk:"Айтыс — екі ақынның домбыра сүйемелдеуімен суырыпсалма өлеңмен жарысы. Ақындар бір-біріне әзіл-қалжыңмен де, өткір сынмен де жауап қайтарады, қоғамның өзекті мәселелерін көтереді. Айтыс өнері ЮНЕСКО-ның материалдық емес мәдени мұра тізіміне енген.",
  tr:"Айтыс — состязание двух акынов-импровизаторов под домбру. Они отвечают друг другу шутками и острой критикой и поднимают злободневные темы. Искусство айтыса включено в список нематериального культурного наследия ЮНЕСКО."},
 {id:"kiiz",kz:"Киіз үй",ru:"Юрта",g:"yurt",
  tk:"Киіз үйді бір-екі сағатта тігіп, жығуға болады. Оның ең маңызды бөлігі — шаңырақ: ол әулеттің, отбасының белгісі саналып, атадан балаға мұра болып қалады. Шаңырақтың бейнесі Қазақстанның елтаңбасында бар. Киіз үй жасау дәстүрі ЮНЕСКО тізіміне енген.",
  tr:"Юрту ставят и разбирают за час-два. Самая важная её часть — шаңырақ, верхний круг купола: символ рода, он переходит от отца к сыну. Шаңырақ изображён на гербе Казахстана. Традиционное мастерство изготовления юрты включено в список ЮНЕСКО."},
 {id:"oyu",kz:"Ою-өрнек",ru:"Орнамент",g:"flower",
  tk:"Ою-өрнек — таңбалар тілі. Ең танымал өрнек — «қошқар мүйіз», ол молшылық пен күштің белгісі. Ою текемет пен сырмаққа, киімге, ер-тұрманға, киіз үйдің жабдықтарына салынады. Әр өрнектің өз мағынасы бар, сондықтан оны оқуға болады.",
  tr:"Казахский орнамент — язык символов. Самый узнаваемый узор — «қошқар мүйіз», бараньи рога, символ достатка и силы. Ою украшает войлочные ковры текемет и сырмақ, одежду, конскую сбрую, убранство юрты. У каждого узора свой смысл, и его можно «прочитать».",

 {id:"kurt",kz:"Құрт",ru:"Сушёный творог",g:"cheese",

let muraLang=(()=>{try{return localStorage.getItem("bari-mura-lang")||"ru";}catch(e){return "ru";}})();
const MURA_ALL=()=>MURA.flatMap(s=>s.c.map(c=>({...c,sec:s})));

async function markCodeRead(id){if(codeProg.read[id])return;const p={...codeProg,read:{...codeProg.read,[id]:todayKey()}};codeProg=p;await store.saveDoc("code","progress",p);toast("Статья в Қоржын!");}

function muraArticle(x,full){
  const read=!!codeProg.read[x.id], txt=muraLang==="kz"?x.tk:x.tr;
  return `<article class="code-card ${full?"full":""}">
    <div class="cc-top">${glyph(x.g,full?50:40)}<div><span class="tag">${esc(x.sec.kz)}</span><h3>${esc(x.kz)}</h3><span class="tip">${esc(x.ru)}</span></div></div>

function openMuraCard(id){
  const x=MURA_ALL().find(c=>c.id===id); if(!x) return;

  document.querySelectorAll("#sheetIn [data-cread]").forEach(b=>b.onclick=async()=>{await markCodeRead(b.dataset.cread);closeSheet();});
  document.querySelectorAll("#sheetIn [data-ml]").forEach(b=>b.onclick=()=>{muraLang=b.dataset.ml;try{localStorage.setItem("bari-mura-lang",muraLang);}catch(e){}openMuraCard(id);});

function checkNewBadges(){
  let seen={}; try{seen=JSON.parse(localStorage.getItem("bari-badges2")||"{}");}catch(e){}

  if(!fresh.length) return;
  fresh.forEach(x=>seen[x.id]=x.tier); try{localStorage.setItem("bari-badges2",JSON.stringify(seen));}catch(e){}

function bindRoom(){

    o.classList.remove("hit"); void o.getBoundingClientRect(); o.classList.add("hit");
    if(t==="lamp"){libState.lamp=!lampOn();saveLib();render();setTimeout(()=>roomSay(ROOM_LINES.lamp()),30);return;}

  for(let i=0;i<n;i++){const el=document.createElement("span");el.className="fx-p";const a=(Math.PI*2*i/n)+Math.random()*.5, d=50+Math.random()*50;
    el.style.left=x+"px";el.style.top=y+"px";el.style.setProperty("--dx",Math.cos(a)*d+"px");el.style.setProperty("--dy",(Math.sin(a)*d-40)+"px");el.style.setProperty("--r",(Math.random()*120-60)+"deg");

function voice(f,t,d,inst,v,dest){
  const c=AC, I=INST[inst]||INST.sine, g=c.createGain(); let head=g; v*=I.vol||1;
  if(I.lp){const fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=I.lp;fl.connect(g);head=fl;}
  g.connect(dest||MASTER);
  const end=I.sus?t+d+(I.rel||.06):t+Math.min(I.dec,d+I.dec*.6);
  const osc=(freq,det,type,gain)=>{const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(freq,t);if(det)o.detune.value=det;
    if(I.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=I.vib;lg.gain.value=freq*.006;l.connect(lg);lg.connect(o.frequency);l.start(t+.15);l.stop(end+.05);}
    if(gain!==1){const og=c.createGain();og.gain.value=gain;o.connect(og);og.connect(head);}else o.connect(head);o.start(t);o.stop(end+.05);};
  osc(f,0,I.type,1); if(I.detune) osc(f,I.detune,I.type,1); if(I.h) osc(f*I.h,0,"sine",I.hv||.2);
  g.gain.setValueAtTime(0.0001,t);
  if(I.sus){g.gain.exponentialRampToValueAtTime(v,t+(I.att||.01));g.gain.setValueAtTime(v*I.sus*1.6,t+d);g.gain.exponentialRampToValueAtTime(0.0001,end);}
  else{g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(0.0001,end);}
}
function playNote(f,t,d,inst,v,dest){const I=INST[inst]||INST.sine;

const COFFEE={
  "Турция":{
    how:"Турецкий кофе варят в маленькой джезве из очень мелкого, почти пудрового помола — прямо с сахаром, если пьют сладкий. Подают в крошечной чашке со стаканом воды и кусочком лукума. Сладость заказывают сразу: sade — без сахара, orta — средний, şekerli — сладкий. Главное — густая пенка köpük.",
    word:["Bir orta kahve, lütfen","Один кофе средней сладости, пожалуйста"],
    recipe:{n:"Турецкий кофе в джезве",ing:["70 мл холодной воды (одна кофейная чашка)","1 полная ч. л. кофе очень мелкого помола","Сахар по вкусу — по желанию"],steps:["Налей холодную воду в джезву, всыпь кофе и сахар, размешай один раз.","Поставь на самый слабый огонь и не мешай. Когда поднимется пенка — сними.","Разложи пенку по чашке, снова доведи до подъёма и аккуратно долей. Подавай со стаканом воды."],tip:"Сначала глоток воды — чтобы почувствовать вкус кофе. Гущу на дне не пьют."},
    facts:["Первые кофейни Стамбула открылись около 1554 года: их открыли двое купцов из Сирии. Кофейня быстро стала местом встреч, игр в нарды и чтения стихов.","В 2013 году культура и традиция турецкого кофе вошли в список нематериального наследия ЮНЕСКО.","Турецкая поговорка: «Bir fincan kahvenin kırk yıl hatırı vardır» — «Чашка кофе помнится сорок лет». Это о благодарности за гостеприимство."],
    legend:{n:"Кофе на смотринах",t:"По обычаю, когда семья жениха приходит свататься, невеста сама варит кофе гостям. Говорят, иногда она кладёт жениху вместо сахара соль: если он выпьет и не поморщится — значит, терпеливый и сильно любит. Сегодня это скорее весёлая традиция."},
    cities:{"Стамбул":"Стамбул — одна из первых кофейных столиц мира: кофейни здесь появились раньше, чем в Европе. Турецкий кофе с лукумом пьют у Босфора, а на пароме — чай.","Каппадокия":"В Каппадокии кофе иногда варят в джезве на горячем песке: песок нагревается ровно, и кофе поднимается медленно, с густой пенкой."}},
  "Италия":{
    how:"«Un caffè» в Италии — это всегда эспрессо. Его пьют стоя у стойки бара (al banco) за пару минут, часто со стаканом воды. Сесть за столик обычно стоит дороже — платишь за обслуживание. Капучино — утренний напиток к корнетто; после обеда молочный кофе заказывают редко: итальянцы считают, что молоко после еды тяжело для желудка.",
    word:["Un caffè, per favore","Один эспрессо, пожалуйста"],
    recipe:{n:"Caffè shakerato — эспрессо со льдом",ing:["1 эспрессо или 50 мл крепкого кофе из мока","1–2 ч. л. сахарного сиропа (или сахара)","5–6 кубиков льда"],steps:["Сразу горячий кофе с сиропом вылей в шейкер или банку со льдом.","Тряси 15–20 секунд, пока не появится плотная пена.","Процеди в бокал — пена останется сверху шапкой."],tip:"Как варить в мока дома: горячую воду налей до клапана, кофе не утрамбовывай, огонь средний. Сними, как только кофе зашипит, иначе появится горечь."},
    facts:[
      "Первую эспрессо-машину запатентовал Анджело Мориондо в Турине в 1884 году. Луиджи Беццера доработал идею в 1901-м, а Дезидерио Павони купил патент и с 1905 года выпускал машины La Pavoni.",
      "Пенки-кремы у эспрессо до 1940-х не было. Её дала рычажная машина Акилле Гаджи (патент 1947–1948): поршень продавливал воду через кофе под давлением около 9 бар. Сначала гостям пришлось объяснять, что пенка — не брак.",
      "Гейзерную кофеварку-мока придумал Альфонсо Биалетти в 1933 году. По семейной истории, идею подсказал бак для кипячения белья: вода в нём поднималась по трубке.",
      "Ховард Шульц решил превратить Starbucks в сеть кофеен после поездки в Милан в 1983 году: его поразили итальянские бары. В 2018 году Starbucks открыл в Милане огромную обжарочную Reserve Roastery."],
    legend:{n:"Папа «крестит» кофе",t:"В конце XVI века советники будто бы просили папу Климента VIII запретить кофе как «напиток неверных». Папа попробовал его и сказал, что напиток слишком хорош, чтобы оставлять его только им, — и «окрестил» его. Красивая история, но документальных подтверждений у неё нет."},
    cities:{
      "Неаполь":"Неаполь — родина caffè sospeso, «подвешенного кофе»: платишь за две чашки, а вторая достаётся тому, кому нечем заплатить. Здесь же раньше варили кофе в cuccumella — кофеварке, которую переворачивают вверх дном, чтобы вода прошла через кофе.",
      "Венеция":"В Венеции одни из первых в Европе кофейни: Caffè Florian на площади Сан-Марко открылся в 1720 году и работает до сих пор.",
      "Рим":"В Риме на Виа Кондотти с 1760 года работает Antico Caffè Greco — здесь бывали Гёте, Байрон и Ганс Христиан Андерсен. А у Пантеона — Sant'Eustachio (1938), где эспрессо подают уже с сахаром и пышной пенкой.",
      "Милан":"Именно миланские бары вдохновили Ховарда Шульца сделать Starbucks сетью кофеен. Сегодня здесь стоит одна из самых больших кофеен Starbucks в мире — в здании бывшей почты."}},
  "Финляндия":{
    how:"Финны — одни из главных кофеманов мира: на человека приходится больше 10 кг кофе в год. Пьют не эспрессо, а фильтр-кофе из капельной кофеварки, и чаще светлой обжарки. Кофейный перерыв — kahvitauko — закреплён во многих трудовых договорах. К кофе — pulla, сладкая булочка с кардамоном.",
    word:["Kahvia, kiitos","Кофе, пожалуйста"],
    recipe:{n:"Juustokahvi — кофе с сыром",ing:["Кубики leipäjuusto — запечённого молодого сыра (замена — плотный несолёный сыр)","Горячий фильтр-кофе"],steps:["Положи 5–6 кубиков сыра в чашку.","Залей горячим кофе.","Пей кофе, а размякший сыр доставай ложкой."],tip:"Так пьют на севере Финляндии и в Лапландии. Сыр не тает, а становится тягучим, как моцарелла."},
    facts:[
      "Компанию Paulig основал в Хельсинки Густав Паулиг в 1876 году — сначала как торговый дом. Свой кофе там обжаривают с 1904 года.",
      "Во время войны кофе продавали по карточкам, и финны пили заменители из цикория и жареного зерна. Карточки на кофе отменили только в 1950-х, и это помнят как праздник.",
      "Светлая обжарка у финнов — давняя привычка: такой кофе кислее и мягче, его можно пить много чашек в день. В магазинах на пачке пишут степень обжарки цифрой."],
    cities:{"Рованиеми":"В Лапландии кофе пьют с сыром leipäjuusto: кубики кладут прямо в чашку."}},
  "Япония":{
    how:"В Японии две кофейные культуры. Kissaten — тихие кофейни эпохи Сёва: тёмное дерево, джаз, кофе заваривают сифоном или вручную для каждой чашки. И кофе на ходу: банки — горячие и холодные — в автоматах на каждом углу и свежий кофе в комбини.",
    word:["Kōhī o kudasai","Кофе, пожалуйста"],
    recipe:{n:"Японский айс-кофе: заварка прямо на лёд",ing:["20 г кофе среднего помола","150 мл воды, 92–94 °C","150 г льда"],steps:["Положи лёд в колбу или банку, поставь сверху воронку с фильтром.","Залей кофе сначала немного водой, подожди 30 секунд, потом лей тонкой струйкой.","Через 2,5–3 минуты кофе готов: лёд сразу охлаждает его и сохраняет аромат."],tip:"Бонус — кофейное желе kōhī zerī: 300 мл крепкого кофе, 2 ч. л. сахара и 2 г агар-агара довести до кипения, разлить и остудить. Подают кубиками со сливками. Агар — растительный, как в японском кантэне."},
    facts:[
      "Первая кофейня западного типа — Kahiichakan — открылась в Токио, в районе Уэно, в 1888 году. Она прогорела через несколько лет, но идея прижилась.",
      "Кофе в банках сделали массовым в Японии: в 1969 году компания UCC выпустила баночный кофе с молоком. Сегодня в автоматах есть и горячие банки — они греются прямо внутри.",
      "Воронку Hario V60 японская компания Hario выпустила в 2004 году. Конус под углом 60° со спиральными рёбрами стал инструментом бариста по всему миру."],
    cities:{"Киото":"Киото известен «киотским холодным кофе» — kyoto-style cold drip: вода капает через кофе по капле много часов в высоких стеклянных башнях. Здесь же с 1940 года работает кофейня Inoda Coffee.","Токио":"Первая кофейня Японии, Kahiichakan, открылась в токийском районе Уэно в 1888 году."}},
  "Франция":{
    how:"«Un café» во Франции — это эспрессо. Утром дома пьют café au lait из большой чаши (bol) и макают туда тартинку или круассан. В кафе садятся на террасе лицом к улице и сидят долго — смотреть на прохожих тоже часть ритуала. Noisette — эспрессо с каплей молока, цвета лесного ореха.",
    word:["Un café, s'il vous plaît","Один кофе, пожалуйста"],
    recipe:{n:"Café au lait",ing:["150 мл крепкого кофе (фильтр, френч-пресс или мока)","150 мл горячего молока","Сахар по вкусу"],steps:["Нагрей молоко почти до кипения и слегка вспень венчиком.","Налей кофе и молоко в большую чашу одновременно с двух сторон.","Подай с багетом, маслом и вареньем — для макания."],tip:"Café au lait — домашний напиток. В кафе закажи café crème, это почти то же самое."},
    facts:[
      "В 1669 году посол Османской империи Сулейман-ага угощал парижскую знать кофе в роскошных приёмах — так кофе стал модой при дворе Людовика XIV.",
      "Café Procope открыл в Париже сицилиец Франческо Прокопио деи Кольтелли в 1686 году. Здесь бывали Вольтер, Руссо и Дидро, а кафе работает до сих пор.",
      "Про Вольтера рассказывают, что он выпивал до 40–50 чашек кофе в день. Скорее всего, это преувеличение, но кофе он и правда очень любил."],
    legend:{n:"Саженец, который делил воду",t:"Около 1723 года морской офицер Габриэль де Клье вёз на Мартинику кофейный саженец. Во время штиля пресной воды не хватало, и он, по его собственному рассказу, делил свою порцию с растением. От этого ростка, как считается, пошли многие кофейные плантации Карибов. Сам рассказ записан, а вот масштаб его роли историки обсуждают до сих пор."},
    cities:{"Париж":"В Париже — Café Procope (1686), одно из старейших кафе Европы. А Les Deux Magots и Café de Flore прославились как кафе писателей и философов."}},
  "Казахстан":{
    how:"Казахстан — прежде всего чайная страна: чай с молоком из пиалы за дастарханом. Кофе — городская культура последних лет: в Алматы и Астане много кофеен, где сами обжаривают зерно, а в каждом городе появились свои кофейни. Любят сиропы, раф и кофе в турке.",
    word:["Бір кофе, өтінемін","Один кофе, пожалуйста"],
    recipe:{n:"Раф",ing:["1 эспрессо (30 мл) или 50 мл крепкого кофе","100 мл сливок 10%","1–2 ч. л. ванильного сахара"],steps:["Смешай кофе, сливки и ванильный сахар в кувшине.","Нагрей и взбей всё вместе: капучинатором, паром кофемашины или поршнем френч-пресса.","Перелей в чашку — получится однородная сливочная пена, без слоёв."],tip:"Для осени — раф с халвой: раствори в сливках ложку подсолнечной халвы перед взбиванием. А в Burka Coffee есть свои авторские рафы — финиковый и с урбечом, дагестанской ореховой пастой."},
    facts:[
      "Раф придумали в Москве в конце 1990-х в кофейне Coffee Bean: бариста взбивали эспрессо со сливками и ванильным сахаром для постоянного гостя Рафаэля. Напиток разошёлся по странам бывшего СССР, а в Италии его почти никто не знает.",
      "Кофе по-турецки, который варят в турке, — родственник казахстанских кофеен. Турецкая кофейная культура внесена в список нематериального наследия ЮНЕСКО в 2013 году.",
      "Казахстан не выращивает кофе: всё зерно привозят. Поэтому каждая местная обжарка — это выбор, из какой страны и с какой фермы везти зерно."],
    cities:{"Атырау":"Атырау — родина Burka Coffee: отсюда сеть разошлась по Казахстану, а рядом с кофейней работает магазин зерна и чая.","Астана":"В Астане тоже есть Burka Coffee — кофейня, которая родом из Атырау.","Актау":"В Актау есть Burka Coffee — кофе с видом на Каспий, родом из соседнего Атырау.","Уральск":"В Уральске тоже есть Burka Coffee — атырауский кофе на берегу Жайыка.","Шымкент":"На юге, в Шымкенте, тоже есть Burka Coffee. А ещё здесь любят зелёный чай.","Алматы":"В Алматы много кофеен со своей обжаркой. Скоро здесь откроется и Burka Coffee."}},
  "Нидерланды":{
    how:"Голландцы пьют кофе часто: утром, в 10 часов (koffietijd) и после обеда. К чашке подают одно печенье — и банку закрывают. Koffie verkeerd, «неправильный кофе», — это когда молока больше, чем кофе.",
    word:["Een koffie, alstublieft","Один кофе, пожалуйста"],
    recipe:{n:"Koffie verkeerd",ing:["50–60 мл крепкого кофе","120 мл горячего молока","Одно печенье stroopwafel"],steps:["Нагрей и вспень молоко.","Налей кофе, сверху молоко: молока должно быть вдвое больше.","Положи вафлю stroopwafel на чашку на минуту — карамель внутри размягчится."]},
    facts:[
      "Голландцы одними из первых в Европе начали выращивать кофе в колониях — на острове Ява с конца XVII века. Отсюда английское прозвище кофе — java.",
      "Компанию Douwe Egberts основали в 1753 году в городке Йоуре во Фрисландии — сначала как лавку колониальных товаров.",
      "В 1706 году саженец кофе с Явы привезли в ботанический сад Амстердама. Это дерево стало «родителем» множества других."],
    legend:{n:"Дерево, которое объехало мир",t:"В 1714 году Амстердам подарил Людовику XIV кофейное дерево из своего ботанического сада. Его потомка, как рассказывают, Габриэль де Клье повёз на Мартинику, — и от него пошли плантации Карибов и Латинской Америки. Так один голландский горшок мог стать предком миллионов кофейных деревьев."},
    cities:{"Амстердам":"В Амстердаме до сих пор работает ботанический сад Hortus Botanicus, куда в 1706 году привезли кофейный саженец с Явы."}},
  "Испания":{
    how:"В Испании кофе пьют маленькими порциями весь день. Café solo — эспрессо, cortado — эспрессо с каплей молока, café con leche — утренний, пополам с молоком. Летом заказывают café con hielo: горячий кофе приносят вместе со стаканом льда, и ты сама выливаешь его на лёд.",
    word:["Un cortado, por favor","Кортадо, пожалуйста"],
    recipe:{n:"Café bombón",ing:["1–2 ст. л. сгущённого молока","1 эспрессо или 40 мл крепкого кофе"],steps:["Налей сгущёнку в маленький прозрачный стакан.","Медленно влей кофе по ложке, чтобы получились два слоя — белый и тёмный.","Полюбуйся слоями и перед питьём размешай."],tip:"Летний валенсийский café del tiempo: эспрессо с сахаром выливают на лёд с долькой лимона."},
    facts:[
      "В Испании есть особая обжарка — torrefacto: зёрна обжаривают с сахаром, и он карамелизуется корочкой. Кофе получается тёмным и горьким; часто его смешивают с обычной обжаркой — это называется mezcla.",
      "Café bombón родом из Валенсии. Его всегда подают в маленьком прозрачном стакане: слои сгущёнки и кофе — часть удовольствия."],
    cities:{"Валенсия":"Валенсия — родина café bombón и летнего café del tiempo — кофе со льдом и лимоном."}},
  "Греция":{
    how:"Греческий кофе (ellinikós kafés) варят в маленьком ковшике-брики из очень мелкого помола и подают с пенкой и стаканом воды. Сладость заказывают сразу: скéто — без сахара, мéтриос — средний, гликú — сладкий. Летом пьют холодный: frappé, freddo espresso, freddo cappuccino — и сидят над одним стаканом часами.",
    word:["Énan métrio, parakaló","Один средней сладости, пожалуйста"],
    recipe:{n:"Frappé",ing:["2 ч. л. растворимого кофе","Сахар по вкусу","2–3 ст. л. холодной воды","Лёд, холодная вода, по желанию молоко"],steps:["Взбей кофе, сахар и немного холодной воды шейкером, венчиком или миксером до густой пены.","Положи лёд в высокий стакан и вылей пену.","Долей холодной воды и, если хочешь, молока. Пьют через трубочку."]},
    facts:[

  for(const x of BARI_ACTS){if((r-=x.w)<0){act=x.k;break;}}

    else if(sv){sv.classList.add("r-"+r.a);}
    if(bub){bub.textContent=gx(r.l);bub.hidden=false;setTimeout(()=>{bub.hidden=true;},7500);}
    setTimeout(()=>{const b2=document.getElementById("bariBtn");if(b2)b2.innerHTML=bari(window.bariStateNow);},7500);
    return;
  }
  if(act==="walk"){
    const max=Math.max(0,Math.min(hero.clientWidth*0.38,hero.clientWidth-btn.clientWidth-24)), to=-Math.round(Math.random()*max);
    if(Math.abs(to-window.bariX)<40) return;
    window.bariFlip=to<window.bariX?-1:1; btn.classList.add("walking"); placeBari();
    window.bariX=to; requestAnimationFrame(placeBari);
    setTimeout(()=>{btn.classList.remove("walking");window.bariFlip=1;placeBari();},2500);
    return;
  }
  if(act==="weather"){const v=weatherNow(journeyFor(todayKey()).city);if(!v||!bub)return;bub.textContent=wxSay(journeyFor(todayKey()).city,v);bub.hidden=false;setTimeout(()=>{bub.hidden=true;},6500);return;}
  if(act==="tea"||act==="read"||act==="wave"){
    const jr=journeyFor(todayKey()), dr=DRINKS[jr.country];
    const brk=act==="tea"&&(jr.country==="Казахстан"?Math.random()<.6:dr?.cup==="espresso"&&Math.random()<.2);
    const prop=act==="tea"?`<g transform="translate(138 118) scale(2.1)">${GLYPHS[brk?"burka":dr?.cup==="espresso"?"espresso":"tea"]}</g>`:act==="read"?`<g transform="translate(66 118) scale(2.8)">${GLYPHS.book2}</g>`:"";
    btn.innerHTML=bari({...st,mood:act==="wave"?"joy":"happy",arms:act==="wave"?"down":"hold",wave:act==="wave",prop});
    let line="";
    if(act==="tea"&&brk) line=CAFE_PARTNER.lines[Math.floor(Math.random()*CAFE_PARTNER.lines.length)];
    else if(act==="tea"&&dr) line=dr.l[Math.floor(Math.random()*dr.l.length)];

    setTimeout(()=>{const b2=document.getElementById("bariBtn");if(b2)b2.innerHTML=bari(window.bariStateNow);},act==="wave"?2600:6500);
    return;
  }
  if(svg){svg.classList.remove("hop","peek","wiggle");void svg.getBoundingClientRect();svg.classList.add(act);setTimeout(()=>svg.classList.remove(act),1400);}
}

function routePlan(){
  const R=hasRoute()?settings.route.map(c=>JOURNEY.find(x=>x.country===c)).filter(Boolean):JOURNEY;
  const st=hasRoute()?(settings.routeStart||mondayOf(todayKey())):JOURNEY_START, S=fromKey(st), tot=R.reduce((a,j)=>a+j.cities.length,0)||1;
  const wk=Math.max(0,Math.floor((fromKey(todayKey())-S)/(7*864e5))), cyc=Math.floor(wk/tot);
  let off=0; const rows=R.map(j=>{const r={j,off,len:j.cities.length};off+=j.cities.length;return r;});
  const pos=wk%tot, ci=rows.findIndex(r=>pos>=r.off&&pos<r.off+r.len);
  const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  return rows.map((r,i)=>{const c=cyc+(i<ci?1:0), start=add(S,(c*tot+r.off)*7);
    const cities=r.j.cities.map(([n],w)=>({n,from:add(start,w*7),to:add(start,w*7+6)}));
    return {...r,now:i===ci,start,end:add(start,r.len*7-1),cities,order:(i-ci+rows.length)%rows.length};}).sort((a,b)=>a.order-b.order);}
function holidaysIn(row){const out=[];
  for(const h of HOLIDAYS){if(h.country&&h.country!==row.j.country)continue;if(!h.country&&row.j.country!=="Казахстан")continue;
    const to=h.to||h.d, hit=[];
    for(const c of row.cities){for(let d=new Date(c.from);d<=c.to;d.setDate(d.getDate()+1)){const k=toKey(d),md=k.slice(5),cur=h.d.length>5?k:md;
      const inR=h.d<=to?(cur>=h.d&&cur<=to):(cur>=h.d||cur<=to); if(inR){hit.push(c.n);break;}}}
    if(hit.length) out.push({city:hit.join(" и "),t:h.t});}
  return out;}

      <p>${r.cities.map(c=>esc(c.n)).join(" → ")}</p>${hol.map(h=>`<p class="rt-hol">${ic("spark")} ${esc(h.city)} — ${esc(h.t)}</p>`).join("")}</div></div>`;}).join("")}</div>

/* owner only: apply a plan prepared by Claude in chat (adds / moves / closes only this user's tasks) */
function projByName(x){if(!x)return settings.projects.find(p=>p.kind!=="home")?.id;const q=String(x).toLowerCase();const P=settings.projects;return (P.find(p=>p.id===x)||P.find(p=>p.name.toLowerCase()===q)||P.find(p=>p.name.toLowerCase().includes(q)||q.includes(p.name.toLowerCase())))?.id||P.find(p=>p.kind!=="home")?.id;}
function parsePlanCode(txt){const s=String(txt||"").trim().replace(/^BARI-PLAN\s*/i,"");const i=s.indexOf("{"),j=s.lastIndexOf("}");if(i<0||j<i)throw new Error("Не нашла код плана.");return JSON.parse(s.slice(i,j+1));}
const findTask=q=>{const n=String(q).toLowerCase();return tasks.filter(t=>!t.done&&t.title.toLowerCase().includes(n)).sort((a,b)=>a.date.localeCompare(b.date))[0]||null;};
const spanH=(a,b)=>{const x=parseHM(a),y=parseHM(b);if(x===null||y===null)return null;return (((y-x+1440)%1440)||1440)/60;};
function planOps(P){
  const ops=[];
  for(const a of P.add||[]){const h=a.from&&a.to?spanH(a.from,a.to):Number(a.h)||1;const home=!!a.home;
    ops.push({kind:"add",text:`Добавить «${a.t}» — ${niceWd(a.d||todayKey())}${a.from?` ${a.from}${a.to?"–"+a.to:""}`:""}${a.due?` · срок ${nice(a.due)}`:""}`,
      run:()=>store.saveTask({id:uid(),title:a.t,project:home?"house":projByName(a.p),stage:home?"me":"task",date:a.d||todayKey(),hours:h,done:false,piece:uid(),time:a.from||"",...(a.due?{due:a.due}:{})})});}
  for(const m of P.move||[]){const t=findTask(m.q);ops.push(t?{kind:"move",text:`Перенести «${t.title}» → ${niceWd(m.d||t.date)}${m.from?` ${m.from}${m.to?"–"+m.to:""}`:""}`,run:()=>store.saveTask({...t,date:m.d||t.date,...(m.from?{time:m.from}:{}),...(m.from&&m.to?{hours:spanH(m.from,m.to)}:{}),...(m.due?{due:m.due}:{})})}:{kind:"miss",text:`Не нашла задачу «${m.q}» — пропущу`});}
  for(const q of P.done||[]){const t=findTask(q);ops.push(t?{kind:"done",text:`Отметить сделанной «${t.title}»`,run:()=>stopTrack(t,{done:true})}:{kind:"miss",text:`Не нашла задачу «${q}» — пропущу`});}
  for(const q of P.del||[]){const t=findTask(q);ops.push(t?{kind:"del",text:`Удалить «${t.title}» (${niceWd(t.date)})`,run:()=>store.deleteTask(t.id)}:{kind:"miss",text:`Не нашла задачу «${q}» — пропущу`});}
  return ops.concat(planExtras(P));
}

function ensureTourDom(){

// fair secret draw: a random permutation from the phone's cryptographic generator, redrawn until nobody gets themselves
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;};
const fairShuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
function drawPairs(names){const n=names.length;if(n<2)return null;let p;for(let t=0;t<1000;t++){p=fairShuffle(names.map((_,i)=>i));if(p.every((x,i)=>x!==i))break;}return names.map((nm,i)=>({n:nm,to:names[p[i]]}));}
const hshP=s=>{let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;let h2=0;for(const c of s)h2=(h2*31+c.charCodeAt(0))>>>0;return h.toString(36)+h2.toString(36);};
const playKey=g=>g.gid||("h"+hshP([g.org||"",g.title,(g.date0??g.date)||"",(g.budget0??g.budget)||"",g.type].join("|")));
async function playRpc(fn,args){const C=window.BARI_CONFIG||{};if(!C.supabaseUrl)throw new Error("nocfg");const r=await fetch(C.supabaseUrl+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:C.supabaseAnonKey,"Content-Type":"application/json"},body:JSON.stringify(args)});if(!r.ok)throw new Error("rpc "+r.status);return r.json();}

/* live secret draw: each person's target is stored encrypted with a key only their link knows, so a redraw reaches everyone by the same link */
const _te=new TextEncoder(), _hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("");
const _b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))), _ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function seatSecret(gk,name,k){return k?("k:"+k):("n:"+gk+"|"+String(name||"").trim().toLowerCase().replace(/\s+/g," "));}
async function seatId(sec){return _hex(await crypto.subtle.digest("SHA-256",_te.encode("id|"+sec))).slice(0,16);}
async function seatKey(sec){const raw=await crypto.subtle.digest("SHA-256",_te.encode("key|"+sec));return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);}
async function sealTo(sec,to){const iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:"AES-GCM",iv},await seatKey(sec),_te.encode(to));return _b64(iv)+"."+_b64(c);}
async function openTo(sec,box){try{const [a,b]=box.split(".");const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:_ub64(a)},await seatKey(sec),_ub64(b));return new TextDecoder().decode(p);}catch(e){return null;}}

async function publishGame(id,g){if(!g.otok)g.otok=newTok();if(g.date0===undefined)g.date0=g.date||"";if(g.budget0===undefined)g.budget0=g.budget||"";
  const gk=playKey(g), a={};for(const p of g.pairs){const sec=await seatSecret(gk,p.n,p.k);a[await seatId(sec)]=await sealTo(sec,p.to);}
  g.rev=(g.rev||0)+1; await store.saveDoc("games",id,g); S.games={...S.games,[id]:g};
  try{return await playRpc("set_game",{p_game:gk,p_token:g.otok,p_data:{d:g.date,b:g.budget,no:g.note,a,rev:g.rev}});}catch(e){return false;}}

  document.querySelectorAll("[data-frem]").forEach(b=>b.onclick=async()=>{const [id,i]=b.dataset.frem.split("|"),g={...S.games[id]},x=g.pairs[+i];

 {s:"steppe",t:"Давным-давно, там, где степь встречается с небом, жила мудрая әже. В её старом сундуке хранились семена. В каждом — крупица чего-то важного: в одном песня, в другом терпение, в третьем — рецепт самых пышных баурсаков."},
 {s:"seeds",t:"Самое маленькое семечко было фиолетовым, с крошечной звездой внутри. Все семена знали, кем станут: деревом, цветком, колоском. А маленькое молчало и только тихонько светилось."},
 {s:"ask",t:"— Кем ты хочешь стать? — спросила әже.\n— Всем, — прошептало семечко. — Бәрі.\nӘже улыбнулась: — Всем стать нельзя. Но можно научиться успевать главное и не терять себя."},
 {s:"leaves",t:"Әже подарила ему два листочка. «Один — для дел, второй — для дома и близких. Расти так, чтобы ни один не завял». А звезда на груди, сказала она, будет загораться каждый раз, когда ты делаешь шаг."},
 {s:"wind",t:"Ветер подхватил семечко и понёс через степь, горы и моря. По дороге оно слушало города: как пьют чай в Лондоне, как кланяются в Токио, как звучит кюй в степи. Так у него вырос хвостик — дорожка, память о пути."},
 {s:"door",t:"Однажды ветер опустил его у твоего порога. Семечко проснулось, огляделось и сказало: «Привет! Я BARI. Давай вместе — шаг за шагом»."},
 {s:"now",t:"С тех пор BARI живёт рядом с тобой. Он путешествует по городам, растит сад из твоих шагов и напоминает самое главное: даже самый длинный путь складывается из маленьких шагов. И сегодня — ещё один."}

function taleScene(s){

  const sky=(a,b)=>`<defs><linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="300" fill="url(#tsky)"/>`;
  const steppe=`<path d="M0 230 Q100 205 200 222 T400 214 V300 H0Z" fill="#C9A86A"/><path d="M0 252 Q120 236 240 248 T400 244 V300 H0Z" fill="#B8955A"/>`;
  const yurt=`<g transform="translate(250 168)"><path d="M0 60 V30 Q40 -6 80 30 V60Z" fill="#F5EBDD"/><path d="M0 30 Q40 -6 80 30" stroke="#C25B3A" stroke-width="4" fill="none"/><path d="M14 38 H66 M10 48 H70" stroke="#C25B3A" stroke-width="2.5"/><rect x="32" y="36" width="16" height="24" fill="#8C5A4A"/></g>`;
  const chest=`<g transform="translate(70 196)"><rect width="74" height="40" rx="5" fill="#8C5A4A"/><path d="M0 12 H74" stroke="#5E3A2E" stroke-width="3"/><rect x="31" y="14" width="12" height="10" rx="2" fill="#E0B84A"/>${[10,24,40,56].map((x,i)=>`<circle class="glow" style="animation-delay:-${i*.5}s" cx="${x+4}" cy="-6" r="5" fill="${["#FFD166","#7CC23A","#FF8A5B","#9C8FFF"][i]}"/>`).join("")}</g>`;
  const seedP=(x,y,sc=1)=>`<g transform="translate(${x} ${y}) scale(${sc})"><ellipse cx="0" cy="0" rx="13" ry="17" fill="#6C5BFF"/><ellipse cx="-4" cy="-6" rx="4" ry="6" fill="#B9AFFF" opacity=".6"/><path class="glow" d="M0 -5 L2 0 L7 1 L2 3 L0 9 L-2 3 L-7 1 L-2 0Z" fill="#FFE27A"/></g>`;

    case "seeds": return sky("#2A2160","#5B4FA8")+stars+`<rect x="40" y="200" width="320" height="16" rx="8" fill="#8C5A4A"/>`+[[80,"#8C6A4A"],[130,"#A0805A"],[180,"#6B8E4E"],[280,"#B37A4C"],[330,"#7A6A5A"]].map(([x,c])=>`<ellipse cx="${x}" cy="186" rx="12" ry="15" fill="${c}"/>`).join("")+seedP(232,182,1.1)+`<circle class="glow" cx="232" cy="182" r="34" fill="#FFD166" opacity=".18"/>`;
    case "ask": return sky("#2A2160","#6A5EBD")+stars+steppe+`<g transform="translate(120 150)"><circle cx="0" cy="0" r="16" fill="#E9C9A6"/><path d="M-18 6 Q0 -28 18 6 L16 12 H-16Z" fill="#C25B3A"/><path d="M-22 16 Q0 90 22 16Z" fill="#7A3B5C"/><path d="M20 30 Q40 34 54 50" stroke="#7A3B5C" stroke-width="9" fill="none" stroke-linecap="round"/></g>`+seedP(196,198,1.3)+`<g class="glow"><circle cx="196" cy="198" r="40" fill="#FFD166" opacity=".16"/></g><g transform="translate(232 120)"><rect width="120" height="42" rx="14" fill="#fff"/><path d="M14 42 L6 56 L28 42Z" fill="#fff"/><text x="60" y="27" text-anchor="middle" font-size="18" font-weight="800" fill="#4E3FD9" font-family="Nunito,sans-serif">Бәрі!</text></g>`;

/* ---------- notifications → app: ?ci=id (ask), ?done=id, ?snooze=id, ?start=id ---------- */
function handleDeepLink(qs){
  const p=new URLSearchParams(qs===undefined?location.search:qs); const act=["done","snooze","start","ci"].find(a=>p.has(a)); if(!act) return;
  const id=p.get(act); let tries=0;
  const go=async()=>{const t=tasks.find(x=>x.id===id); if(!t||!store){if(++tries<30) return setTimeout(go,500); return;}
    try{history.replaceState(null,"",location.pathname);}catch(e){}
    if(act==="done"){if(!t.done){await handleCi("done",id);}toast(gx(`Отмечено: «${t.title}» — сделала`));}
    else if(act==="start"){if(!t.startedAt)await startTrack(t);toast(`▶ Засекаю время: «${t.title}»`);}
    else if(act==="snooze"){await handleCi("more",id);toast("Добавила 15 минут — напомню снова");}
    else openCiSheet(t);};
  go();
}
function openCiSheet(t){
  if(t.done){toast("Уже отмечено ✓");return;}

function routeJourney(k){
  const r=settings.route, start=settings.routeStart||mondayOf(todayKey());
  const wk=Math.max(0,Math.floor((fromKey(k)-fromKey(start))/(7*864e5)));
  const L=r.map(c=>(JOURNEY.find(x=>x.country===c)||JOURNEY[0]).cities.length), tot=L.reduce((a,b)=>a+b,0)||1;
  let w=wk%tot, i=0; while(i<L.length-1&&w>=L[i]){w-=L[i];i++;}
  const jn=JOURNEY.find(x=>x.country===r[i])||JOURNEY[0];
  const [city,mark]=jn.cities[w%jn.cities.length];
  return {country:jn.country,lang:jn.lang,city,mark,week:wk};
}

function makeDb(sb,uid){
  const state={}, listeners={}, docListeners={};
  const mk=(id,data,fromCache)=>({id,exists:data!==undefined,data:()=>data,metadata:{fromCache:!!fromCache,hasPendingWrites:false}});
  function emit(col,fromCache){
    const m=state[col]||new Map(), docs=[...m].map(([id,data])=>mk(id,data,fromCache));
    (listeners[col]||[]).forEach(cb=>{try{cb({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:!!fromCache,hasPendingWrites:false},docChanges:()=>[]});}catch(e){console.error(e);}});
    for(const [key,cbs] of Object.entries(docListeners)){const [c,id]=key.split("/");if(c===col)cbs.forEach(cb=>{try{cb(mk(id,m.get(id),fromCache));}catch(e){console.error(e);}});}
  }
  async function refresh(col){
    const {data,error}=await sb.from("docs").select("id,data").eq("col",col).eq("user_id",uid);
    if(error) throw {code:"unavailable",message:error.message};
    state[col]=new Map(data.map(r=>[r.id,r.data])); emit(col,false);
  }
  const watched=new Set();
  const refreshAll=()=>Promise.all([...watched].map(c=>refresh(c).catch(()=>{})));
  sb.channel("docs-"+uid).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:`user_id=eq.${uid}`},()=>{clearTimeout(refreshAll.t);refreshAll.t=setTimeout(refreshAll,400);}).subscribe();
  setInterval(refreshAll,60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshAll();});
  function docRef(col,id){
    return {
      async set(data){(state[col]=state[col]||new Map()).set(id,data);emit(col,false);
        const {error}=await sb.from("docs").upsert({user_id:uid,col,id,data,updated_at:new Date().toISOString()});
        if(error) throw {code:"unavailable",message:error.message};},
      async delete(){state[col]?.delete(id);emit(col,false);
        const {error}=await sb.from("docs").delete().eq("col",col).eq("id",id).eq("user_id",uid);
        if(error) throw {code:"unavailable",message:error.message};},
      onSnapshot(cb,err){const key=col+"/"+id;(docListeners[key]=docListeners[key]||[]).push(cb);
        if(!watched.has(col)){watched.add(col);refresh(col).catch(e=>err&&err(e));} else if(state[col]) cb(mk(id,state[col].get(id),false));
        return ()=>{docListeners[key]=docListeners[key].filter(f=>f!==cb);};},
      collection(){throw new Error("not used");}
    };
  }
  return {
    collection(col){return {
      doc(id){return docRef(col,id||("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)));},
      onSnapshot(cb,err){(listeners[col]=listeners[col]||[]).push(cb);
        if(!watched.has(col)){watched.add(col);refresh(col).catch(e=>err&&err(e));} else if(state[col]) emit(col,false);
        return ()=>{listeners[col]=listeners[col].filter(f=>f!==cb);};}
    };},
    doc(path){const [c,id]=path.split("/");return docRef(c,id);}
  };
}

  contentCache[kind][k]=r||false;
  render();
  return contentCache[kind][k];
}
async function seedIfEmpty(sb,uid){
  const {count}=await sb.from("docs").select("id",{count:"exact",head:true}).eq("user_id",uid);
  if(count>0) return;
  try{
    const r=await fetch("seed.json",{cache:"no-cache"}); if(!r.ok) return;
    const seed=await r.json(); const rows=[];
    for(const [col,docs] of Object.entries(seed)) for(const [id,data] of Object.entries(docs)) rows.push({user_id:uid,col,id,data,updated_at:new Date().toISOString()});
    for(let i=0;i<rows.length;i+=200){await sb.from("docs").upsert(rows.slice(i,i+200));}
  }catch(e){console.error(e);}
}
const AUTH_ERR=m=>{m=String(m||"");
  if(/Invalid login/i.test(m)) return "Неверная почта или пароль. Если ты здесь впервые — открой вкладку «Регистрация».";
  if(/already registered|already exists/i.test(m)) return "Такая почта уже зарегистрирована. Открой вкладку «Вход».";
  if(/Password should be|at least 6/i.test(m)) return "Пароль слишком короткий: нужно минимум 6 символов.";
  if(/valid email|invalid format|Unable to validate email/i.test(m)) return "Проверь почту: похоже, в адресе опечатка.";
  if(/Email not confirmed/i.test(m)) return "Почта ещё не подтверждена. Найди письмо от Supabase и нажми ссылку в нём.";
  if(/rate limit|too many/i.test(m)) return "Слишком много попыток. Подожди пару минут и попробуй снова.";
  if(/fetch|network/i.test(m)) return "Нет связи с сервером. Проверь интернет.";
  return m;};
const APP_URL=()=>location.origin+location.pathname;
function showLogin(sb,msg,mode){
  mode=mode||(localStorage.getItem("bari-was-here")?"in":"up");
  const box=document.getElementById("login"); box.hidden=false;
  document.querySelector(".wrap").hidden=true; document.querySelector(".tabbar").hidden=true; document.getElementById("fab").hidden=true;
  const T={in:["Вход","С возвращением! Введи почту и пароль, которые указывала при регистрации.","Войти","current-password"],
           up:["Регистрация","Впервые здесь? Придумай пароль — минимум 6 символов. Письма подтверждать не нужно.","Создать аккаунт","new-password"],
           reset:["Забыла пароль","Введи почту — пришлём письмо со ссылкой. Нажми её, и BARI попросит новый пароль.","Прислать ссылку",""]}[mode];
  box.innerHTML=`<div class="login-card">${bari({mood:mode==="reset"?"think":"happy",wave:mode!=="reset",size:120})}
    <h1 class="login-h">BARI</h1><p class="tip" style="text-align:center;margin:0">Твой день, твои цели и целый мир — в одном месте</p><p class="tip" style="text-align:center;font-size:11px;margin:6px 0 0;opacity:.7">© 2026 BARI. Все права защищены.</p>
    ${mode!=="reset"?`<div class="auth-tabs" role="tablist"><button type="button" role="tab" aria-selected="${mode==="in"}" data-mode="in">Вход</button><button type="button" role="tab" aria-selected="${mode==="up"}" data-mode="up">Регистрация</button></div>`:`<h2 class="auth-h">${T[0]}</h2>`}
    <p class="auth-hint">${T[1]}</p>
    <form id="loginForm" class="field" style="width:100%" novalidate>
      <label class="label" for="lEmail">Почта</label><input id="lEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@mail.com" value="${esc(localStorage.getItem("bari-email")||"")}">
      ${mode!=="reset"?`<label class="label" for="lPass">Пароль</label><div class="pass-wrap"><input id="lPass" type="password" autocomplete="${T[3]}" placeholder="${mode==="up"?"Минимум 6 символов":"Твой пароль"}"><button type="button" class="pass-eye" id="lEye" aria-label="Показать пароль">${ic("eye")}</button></div>`:""}
      ${mode==="up"?`<label class="label" for="lPass2">Пароль ещё раз</label><input id="lPass2" type="password" autocomplete="new-password" placeholder="Повтори пароль">`:""}
      <button class="primary" type="submit" style="margin-top:8px">${T[2]}</button>
      ${mode==="in"?`<button class="ghost" type="button" data-mode="reset">Забыла пароль?</button>`:""}
      ${mode==="reset"?`<button class="ghost" type="button" data-mode="in">← Назад ко входу</button>`:""}
      <p class="auth-msg" id="lMsg" role="status">${esc(msg||"")}</p>
    </form></div>`;
  const say=(t,ok)=>{const el=document.getElementById("lMsg");el.textContent=t;el.classList.toggle("ok",!!ok);};
  box.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>showLogin(sb,"",b.dataset.mode));
  const eye=document.getElementById("lEye"); if(eye) eye.onclick=()=>{const i=document.getElementById("lPass");i.type=i.type==="password"?"text":"password";};
  document.getElementById("loginForm").onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById("lEmail").value.trim(), pass=document.getElementById("lPass")?.value||"";
    if(!/^\S+@\S+\.\S+$/.test(email)){say("Введи почту, например name@mail.com.");return;}
    try{localStorage.setItem("bari-email",email);}catch(_){}
    const btn=e.target.querySelector(".primary"); btn.disabled=true;
    try{
      if(mode==="in"){say("Вхожу…");const {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)say(AUTH_ERR(error.message));else{try{localStorage.setItem("bari-was-here","1");}catch(_){}}}
      else if(mode==="up"){
        if(pass.length<6){say("Пароль слишком короткий: нужно минимум 6 символов.");return;}
        if(pass!==document.getElementById("lPass2").value){say("Пароли не совпадают. Введи ещё раз.");return;}
        say("Создаю аккаунт…");const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:APP_URL()}});
        if(error) say(AUTH_ERR(error.message));
        else if(!data.session) say("Почти готово: мы отправили письмо. Открой его и нажми ссылку, потом вернись сюда и войди.",true);
        else {try{localStorage.setItem("bari-was-here","1");}catch(_){}}
      } else {
        say("Отправляю письмо…");const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL()});
        say(error?AUTH_ERR(error.message):"Письмо отправлено. Проверь почту (и папку «Спам») и нажми ссылку в письме.",!error);
      }
    } finally {btn.disabled=false;}
  };
}
function showNewPassword(sb){
  const box=document.getElementById("login"); box.hidden=false;
  document.querySelector(".wrap").hidden=true; document.querySelector(".tabbar").hidden=true; document.getElementById("fab").hidden=true;
  box.innerHTML=`<div class="login-card">${bari({mood:"wink",size:110})}<h2 class="auth-h">Новый пароль</h2><p class="auth-hint">Придумай новый пароль — минимум 6 символов.</p>
    <form id="npForm" class="field" style="width:100%"><input id="np1" type="password" autocomplete="new-password" placeholder="Новый пароль"><input id="np2" type="password" autocomplete="new-password" placeholder="Ещё раз"><button class="primary" type="submit">Сохранить и войти</button><p class="auth-msg" id="npMsg"></p></form></div>`;
  document.getElementById("npForm").onsubmit=async e=>{e.preventDefault();const a=document.getElementById("np1").value,b=document.getElementById("np2").value,m=document.getElementById("npMsg");
    if(a.length<6){m.textContent="Нужно минимум 6 символов.";return;} if(a!==b){m.textContent="Пароли не совпадают.";return;}
    const {error}=await sb.auth.updateUser({password:a}); if(error){m.textContent=AUTH_ERR(error.message);return;}
    try{localStorage.setItem("bari-was-here","1");}catch(_){}
    location.replace(APP_URL());};
}

document.addEventListener("click",async e=>{if(e.target.closest?.("#logoutBtn")&&window.sbClient){if(confirm("Выйти из аккаунта на этом устройстве?")){
  // stop this phone from getting this account's reminders
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub){await window.sbClient.from("docs").delete().eq("col","push").eq("id",hashId(sub.toJSON().endpoint)).eq("user_id",window.sbUserId);await sub.unsubscribe();}}catch(_){}
  try{localStorage.removeItem("bari-push");}catch(_){}
  await window.sbClient.auth.signOut();}}});
async function startApp(sb,session){
  document.getElementById("login").hidden=true; document.querySelector(".wrap").hidden=false; document.querySelector(".tabbar").hidden=false;
  const uid=session.user.id; window.sbUserId=uid;
  await seedIfEmpty(sb,uid);
  const db=makeDb(sb,uid);
  store=await dbStore(db); setStatus("");
  render();
}
render();
try{showSplash();}catch(e){}
fetch("content/fixes.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{if(j){window.BARI_FIXES=j;try{render();}catch(e){}}}).catch(()=>{});
(async()=>{
  if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
  const cfg=window.BARI_CONFIG||{};
  if(!window.supabase||!cfg.supabaseUrl||cfg.supabaseUrl.includes("YOUR_")){store=localStore();setStatus("Задачи хранятся только на этом устройстве: база ещё не подключена.");render();ensureRecurring();return;}
  const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  let started=false;
  window.sbClient=sb;
  const recovery=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="PASSWORD_RECOVERY"){showNewPassword(sb);return;} if(s&&!started&&!recovery){started=true;try{localStorage.setItem("bari-was-here","1");}catch(_){}startApp(sb,s);} if(ev==="SIGNED_OUT"){location.reload();}});
  if(recovery){showNewPassword(sb);return;}
  if(session){started=true;await startApp(sb,session);} else showLogin(sb);
  setInterval(()=>{if(view==="today"&&document.getElementById("sheet").hidden) render();},30000);
})();
})();
</script>
