<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BARI</title>
<meta name="description" content="BARI — твой план, ритм и 20 минут эрудиции в день">
<meta name="theme-color" content="#5B4BDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BARI">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Golos+Text:wght@400;500;600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: phone-first app — greeting hero with day ring, task cards with icon tiles, fixed bottom tab bar, slide-up sheets */
:root{
  --bg:#F3F2F8; --surface:#FFFFFF; --surface-2:#F8F7FC; --ink:#1E1B2E; --muted:#6E6A82; --line:#E6E3EF;
  --accent:#5B4BDB; --accent-ink:#FFFFFF; --accent-soft:#ECE9FD;
  --ok:#2F9E6A; --ok-soft:#DFF4E9; --warn:#D9542B; --warn-soft:#FCE6DD;
  --home:#C2527F; --home-soft:#FBE8F0;
  --p-alpha:#3B6FE0; --p-burka:#93323C; --p-columbus:#118775; --p-blog:#C48712; --p-other:#7A5AC8;
  --p-book:#7356C8; --p-bake:#C9771F; --p-clean:#2F8FA8;
  --shadow:0 1px 2px rgba(30,27,46,.05),0 6px 20px rgba(30,27,46,.06);
  --display:"Nunito","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13121A; --surface:#1D1B27; --surface-2:#242231; --ink:#ECEAF4; --muted:#9C98B0; --line:#2F2C3D;
  --accent:#9A8CFF; --accent-ink:#15131F; --accent-soft:#2A2550;
  --ok:#5ACB91; --ok-soft:#1A3328; --warn:#FF8B62; --warn-soft:#3D2219;
  --home:#F08DB5; --home-soft:#3A1F2C;
  --p-alpha:#7AA2FF; --p-burka:#E58690; --p-columbus:#45C9B3; --p-blog:#F1BC52; --p-other:#B8A2FF;
  --p-book:#B39BFF; --p-bake:#F2A85A; --p-clean:#5CC3DC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121A; --surface:#1D1B27; --surface-2:#242231; --ink:#ECEAF4; --muted:#9C98B0; --line:#2F2C3D;
  --accent:#9A8CFF; --accent-ink:#15131F; --accent-soft:#2A2550;
  --ok:#5ACB91; --ok-soft:#1A3328; --warn:#FF8B62; --warn-soft:#3D2219;
  --home:#F08DB5; --home-soft:#3A1F2C;
  --p-alpha:#7AA2FF; --p-burka:#E58690; --p-columbus:#45C9B3; --p-blog:#F1BC52; --p-other:#B8A2FF;
  --p-book:#B39BFF; --p-bake:#F2A85A; --p-clean:#5CC3DC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(170px + env(safe-area-inset-bottom,0px))}
button{font-family:var(--body);color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hours{font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:600;font-size:16px;margin:26px 0 12px;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .count{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);margin-left:auto}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* hero */
.hero{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero-text{min-width:0;display:grid;gap:6px}
.greet{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.date{color:var(--muted);font-weight:600;font-size:14px}
.note{font-size:14px;margin:4px 0 0;color:var(--muted)}
.note.good{color:var(--ok);font-weight:700}
.note.bad{color:var(--warn);font-weight:700}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2);stroke-width:10;fill:none}
.ring .pl{stroke:var(--accent-soft);stroke-width:10;fill:none;stroke-linecap:round}
.ring .dn{stroke:var(--accent);stroke-width:10;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring.over .pl{stroke:var(--warn-soft)}
.ring.over .dn{stroke:var(--warn)}
.ring.full .dn{stroke:var(--ok)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--display);font-weight:600;font-size:17px}
.ring-c span{font-size:11px;color:var(--muted);font-weight:700}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:18px;padding:12px 14px;margin-top:12px;font-size:14px;background:var(--warn-soft)}
.banner.soon{background:var(--accent-soft)}
.banner .tile{width:34px;height:34px}

/* stat chips */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:600;font-size:16px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}

/* tiles + tasks */
.tile{--pc:var(--accent);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent)}
.list{display:grid;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 10px 10px 12px;box-shadow:var(--shadow)}
.task .body{min-width:0;cursor:pointer;display:grid;gap:3px}
.task .title{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.task.done{box-shadow:none;background:var(--surface-2)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.done .tile{filter:grayscale(1);opacity:.55}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.meta .pn{display:inline-flex;gap:5px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:transparent;padding:0;transition:background .15s,border-color .15s}
.check:hover{border-color:var(--accent)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check svg{width:18px;height:18px;stroke-width:2.6}
.home-list .task{background:var(--home-soft);box-shadow:none}
.home-list .task.done{opacity:.7}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:20px;color:var(--muted);text-align:center;font-size:14px;display:grid;gap:8px;justify-items:center}
.empty .tile{width:46px;height:46px}
.mini-btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.mini-btn svg.i{width:16px;height:16px}

/* week */
.weekbar{background:var(--surface);border-radius:22px;padding:14px;box-shadow:var(--shadow);display:grid;gap:12px}
.weeknav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.weeknav strong{font-family:var(--display);font-weight:600;font-size:15px;text-align:center}
.weeknav small{display:block;font-family:var(--body);color:var(--muted);font-weight:600;font-size:12.5px}
.navbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.sday{border:0;background:none;padding:0;cursor:pointer;display:grid;gap:6px;justify-items:center}
.sbar{width:100%;max-width:34px;height:64px;border-radius:10px;background:var(--surface-2);position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:10px}
.sbar.over i{background:var(--warn)}
.sbar .lim{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.5}
.sday span{font-size:12px;font-weight:700;color:var(--muted)}
.sday.today span{color:var(--accent)}
.sday[aria-pressed="true"] .sbar{outline:2px solid var(--accent);outline-offset:2px}
.weeklist{display:grid;gap:12px;margin-top:14px}
.day{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;scroll-margin-top:16px}
.day.today{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day-name{font-family:var(--display);font-weight:600;font-size:15px}
.day-name span{font-family:var(--body);color:var(--muted);font-weight:600;font-size:13px;margin-left:6px}
.pill{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.over{background:var(--warn-soft);color:var(--warn)}
.pill.free{background:var(--ok-soft);color:var(--ok)}
.chips{display:grid;gap:4px}
.chip{display:flex;gap:10px;align-items:center;font-size:14px;border:0;background:none;padding:5px 2px;text-align:left;cursor:pointer;width:100%;border-radius:10px}
.chip:hover{background:var(--surface-2)}
.chip .tile{width:30px;height:30px;border-radius:9px}
.chip .tile svg.i{width:16px;height:16px}
.chip .t{min-width:0;overflow-wrap:anywhere;font-weight:600}
.chip .t small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.chip.done .t{text-decoration:line-through;color:var(--muted)}
.chip .h{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700;flex:none}
.chip.home .t{color:var(--home)}
.block-line{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;background:var(--warn-soft);border-radius:12px;padding:8px 10px;flex-wrap:wrap}

/* rhythm */
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row label{font-weight:600;display:flex;gap:10px;align-items:center}
select,input[type=text],input[type=date],input[type=number]{font:600 15px var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:11px;padding:8px 11px;font-weight:800;font-size:13px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tip{font-size:14px;color:var(--muted);margin:0;max-width:65ch}
.tpl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.tpl:first-child{border-top:0;padding-top:0}
.tpl .body{min-width:0;display:grid;gap:2px}
.tpl .title{font-weight:700;overflow-wrap:anywhere}
.danger{color:var(--warn)!important}
.seg{display:flex;gap:6px;flex-wrap:wrap}

/* bottom bar + fab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.tabbar button svg.i{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] .ico{background:var(--accent-soft)}
.tabbar .ico{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .2s}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;border:0;background:var(--accent);color:var(--accent-ink);font:800 15px var(--body);height:56px;padding:0 20px 0 16px;border-radius:18px;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 40%,transparent);cursor:pointer;display:flex;gap:8px;align-items:center}
.fab svg.i{width:22px;height:22px;stroke-width:2.4}
.timer-pill{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:7;border:0;background:var(--ink);color:var(--bg);font:800 14px var(--body);padding:10px 14px;border-radius:99px;display:flex;gap:8px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.timer-pill svg.i{width:18px;height:18px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(14,12,24,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:26px 26px 0 0;max-height:90%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:16px}
.sheet h3{font-family:var(--display);font-weight:600;font-size:18px;margin:0;display:flex;gap:10px;align-items:center}
.field{display:grid;gap:8px}
.field input,.field select{width:100%}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.pick button svg.i{width:16px;height:16px}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.preview{display:grid;gap:8px;background:var(--surface-2);border-radius:16px;padding:12px}
.pv{display:flex;gap:10px;align-items:center;font-size:14px}
.pv .tile{width:30px;height:30px;border-radius:9px}
.pv .tile svg.i{width:16px;height:16px}
.pv b{min-width:0}
.pv .d{color:var(--muted);font-weight:600;font-size:13px}
.pv.over .d{color:var(--warn);font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:14px 18px;border-radius:14px;cursor:pointer;flex:1;display:flex;gap:8px;justify-content:center;align-items:center}
.ghost{border:1px solid var(--line);background:none;font-weight:700;font-size:15px;padding:13px 16px;border-radius:14px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.timer{display:grid;justify-items:center;gap:14px;padding-block:6px}
.timer .ring,.timer .ring svg{width:200px;height:200px}
.timer .ring .trk,.timer .ring .dn{stroke-width:12}
.timer .ring-c b{font-size:38px}
.places{display:grid;gap:8px;margin-top:12px}
.place-card{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--pc)}
.place-card .tile{--pc:inherit;color:var(--pc);background:color-mix(in srgb,var(--pc) 15%,transparent)}
.place-card div{display:grid;gap:1px;min-width:0}
.place-card b{font-family:var(--display);font-weight:600;font-size:15px}
.place-card small{color:var(--muted);font-weight:600;font-size:13px}
.block-line.place{background:color-mix(in srgb,var(--pc) 12%,transparent)}
.block-line.place svg.i{color:var(--pc);width:16px;height:16px}
textarea{font:500 15px var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;resize:vertical}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task{display:flex}
.task .body{flex:1}
.task.running{box-shadow:0 0 0 2px var(--ok),var(--shadow)}
.task.running.over{box-shadow:0 0 0 2px var(--warn),var(--shadow)}
.play{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.play svg.i{width:16px;height:16px}
.task.running .play{background:var(--ok);color:var(--surface)}
.task.running.over .play{background:var(--warn)}
.over-t{color:var(--warn)!important;font-weight:800}
.tl{display:grid;gap:8px}
.tl-row{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center}
.tl-row > .task{min-width:0}
.tl-time{font-weight:800;font-size:14px;display:grid;line-height:1.15}
.tl-time small{font-size:11.5px;color:var(--muted);font-weight:700}
.tl-row.late .tl-time{color:var(--warn)}
.now-line{display:flex;align-items:center;gap:8px;color:var(--warn);font-size:12px;font-weight:800}
.now-line::after{content:"";flex:1;border-top:2px solid var(--warn)}
.banner.run{background:var(--warn-soft);align-items:center}
.banner.run.ok{background:var(--ok-soft)}
.timer-pill.over{background:var(--warn);color:var(--surface)}
.pill-t{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:12px 16px;border-radius:16px;box-shadow:var(--shadow);max-width:min(520px,calc(100% - 32px));text-align:center}
.srow{display:grid;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.srow:nth-child(2){border-top:0;padding-top:0}
.sbars{display:grid;gap:3px}
.sbars i{display:block;height:6px;border-radius:99px;background:var(--accent-soft)}
.sbars i.f{background:var(--accent)}
.sbars i.f.over{background:var(--warn)}
input[type=time]{font:600 15px var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.checkin{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border-radius:18px;padding:14px;margin-top:12px}
.checkin.start{background:var(--accent-soft)}
.checkin .ci-body{min-width:0;flex:1;display:grid;gap:10px}
.checkin p{margin:0;font-size:15px;line-height:1.45}
.checkin.big{margin-top:0;background:none;padding:0}
.checkin.big p{font-size:17px}
.ci-acts{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn.ok{background:var(--ok);color:var(--surface);border-color:transparent}
.tl-row .task.done{opacity:.75}
.block{--pc:var(--accent);background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border-left:5px solid var(--pc);padding:10px;display:grid;gap:8px}
.block .task{box-shadow:none;background:var(--surface-2);border-radius:14px}
.block .task.running{box-shadow:0 0 0 2px var(--ok)}
.block-h{display:flex;gap:10px;align-items:baseline;padding:2px 4px;flex-wrap:wrap}
.block-h .bt{font-family:var(--display);font-weight:600;font-size:15px}
.block-h b{font-size:15px}
.block-h .bc{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--muted)}
.block.active{box-shadow:0 0 0 2px var(--pc),var(--shadow)}
.block.late .bt{color:var(--warn)}
.block.bdone{opacity:.7}
.tl{display:grid;gap:12px}
/* BARI scene, journey and «Я» tab */
.scene{position:relative;border-radius:26px;overflow:hidden;height:190px;box-shadow:var(--shadow);margin-bottom:12px;isolation:isolate}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.scene-text{position:absolute;left:18px;top:16px;right:150px;display:grid;gap:4px}
.scene-city{display:inline-flex;align-self:start;justify-self:start;gap:6px;align-items:center;background:rgba(255,255,255,.72);color:#2A2550;font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.scene-city svg.i{width:14px;height:14px}
.scene .greet{color:#1E1B2E;font-size:21px;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.scene.night .greet{color:#fff;text-shadow:none}
.scene-bari{position:absolute;right:8px;bottom:-4px;border:0;background:none;padding:0;cursor:pointer}
.bari{display:block;overflow:visible}
.scene-bari .bari{animation:float 5s ease-in-out infinite}
.bari-star{transform-origin:100px 174px;animation:glow 3s ease-in-out infinite}
.scene-bari:active .bari{transform:scale(.96,1.03)}
.bubble{position:absolute;right:120px;bottom:120px;background:#fff;color:#1E1B2E;font-weight:700;font-size:13.5px;padding:9px 12px;border-radius:16px 16px 4px 16px;box-shadow:var(--shadow);max-width:200px;z-index:2}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1.5deg)}}
@keyframes glow{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.particles{position:absolute;inset:0;pointer-events:none;z-index:1}
.particles i{position:absolute;top:-14px;width:12px;height:12px;animation:fall linear infinite;opacity:.85}
.p-leaf i{background:#E58A3A;border-radius:0 70% 0 70%}
.p-leaf i:nth-child(3n){background:#F2B33D}
.p-leaf i:nth-child(4n){background:#C9783B}
.p-snow i{background:#fff;border-radius:50%;width:7px;height:7px}
.p-petal i{background:#FFB3C7;border-radius:70% 0 70% 0;width:9px;height:9px}
.p-rain i{background:linear-gradient(#fff0,#C9D6E8);width:2px;height:16px;border-radius:2px;animation-name:rainFall!important;opacity:.7}
@keyframes rainFall{0%{transform:translate(0,0)}100%{transform:translate(-30px,105vh)}}
.p-spark i{background:#FFE27A;border-radius:50%;width:5px;height:5px;box-shadow:0 0 8px #FFD166}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(40px,210px) rotate(320deg)}}
@media (prefers-reduced-motion: reduce){.scene-bari .bari,.bari-star,.particles i{animation:none}}
.tabbar-in{grid-template-columns:repeat(4,1fr)!important}
/* me */
.journey{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.j-h{margin:4px 0 6px!important;font-size:18px!important}
.mbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;margin-top:8px}
.mb{display:grid;justify-items:center;gap:4px}
.mb-bar{width:100%;max-width:30px;border-radius:9px;background:var(--surface-2);display:block}
.mb-bar.done{background:var(--accent)}
.mb-bar.today{outline:2px solid var(--accent);outline-offset:2px}
.mb-l{font-size:12px;font-weight:800;color:var(--muted)}
.mb-t svg.i{width:14px;height:14px;color:var(--muted)}
.lesson-start{display:grid;gap:12px;justify-items:start}
.lesson-start h3,.lesson h3{font-family:var(--display);font-weight:600;font-size:18px;margin:4px 0 0;text-wrap:balance}
.tile.big{width:52px;height:52px;border-radius:16px}
.lesson{display:grid;gap:8px;max-width:65ch}
.lesson p{margin:0 0 4px;line-height:1.6}
.lesson h4{font-family:var(--display);font-weight:600;font-size:15px;margin:10px 0 2px}
.lesson .hook{font-size:16px;font-weight:600}
.facts{background:var(--accent-soft);border-radius:16px;padding:12px 14px}
.facts ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
.words{display:grid;gap:8px;background:var(--surface-2);border-radius:16px;padding:12px 14px}
.word{display:grid;gap:1px}
.word b{font-size:16px;color:var(--accent)}
.word span{font-weight:600}
.word small{color:var(--muted)}
.talk{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);border-radius:16px;padding:12px 14px;font-size:14px}
.talk.kid{background:var(--home-soft)}
.talk svg.i{flex:none;margin-top:2px}
.q{display:grid;gap:8px;padding-block:8px;border-top:1px solid var(--line)}
.q p{margin:0}
.opts{display:grid;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;font-size:14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.opt.dim{opacity:.55}
.why{font-size:13.5px;color:var(--warn)!important;font-weight:600}
.why.ok{color:var(--ok)!important}
.done-card{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border-radius:18px;padding:12px}
.news{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.news summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;list-style:none}
.news summary::-webkit-details-marker{display:none}
.news p{margin:8px 0 0;font-size:14px;line-height:1.55}
.tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tab-bari{width:30px;height:30px}

/* full-screen city background */
html{background:var(--bg)}
body{background:transparent!important}
#cityBg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#cityBg svg{position:absolute;inset:0;width:100%;height:100%}
#cityBg .particles{position:absolute;inset:0}
#cityBg .particles i{animation-name:fallFull}
@keyframes fallFull{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(60px,105vh) rotate(420deg)}}
.city-hero{position:relative;min-height:min(calc(50vh - 30px),520px);padding-block:6px 4px;display:grid;align-content:start;gap:8px}
.city-hero .scene-city{background:rgba(255,255,255,.78)}
.city-hero .greet{font-size:23px;color:#1E1B2E;max-width:62%;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.city-night .city-hero .greet{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.city-hero .scene-bari{right:-6px;bottom:4px;top:auto}
.city-hero .bubble{right:130px;bottom:150px;max-width:240px;line-height:1.4}
.bubble .bb-ru{display:block;font-weight:600;font-size:12px;color:#5B5670;margin-top:4px}
.bubble .bb-a{display:block;font-weight:800;font-size:12px;color:#6C5BFF;margin-top:4px}
.city-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;max-width:calc(100% - 130px)}
.city-chips::-webkit-scrollbar{display:none}
.city-chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:6px 10px 6px 7px;font-weight:800;font-size:12.5px;color:#2A2550;box-shadow:0 4px 14px rgba(30,27,46,.10)}
/* glass cards so the city shows through */
.hero,.stat,.block,.card,.day,.journey,.weekbar,.empty,.news,.saved,.result,.item,.today-box,.place-card,.list>.task,.home-list .task,.chips .chip{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}
.block .task{background:color-mix(in srgb,var(--surface-2) 75%,transparent)!important}
.empty{border-color:color-mix(in srgb,var(--line) 70%,transparent)}
h2{background:color-mix(in srgb,var(--surface) 70%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:6px 10px;margin-inline:-4px}
.tabbar{background:color-mix(in srgb,var(--surface) 86%,transparent)!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.status{color:var(--ink);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:10px;padding:4px 8px;justify-self:center;width:max-content;max-width:100%;margin-inline:auto}
@media (prefers-reduced-motion: reduce){#cityBg .particles{display:none}}

/* extras */
.moodcard,.habits,.ideabox,.linkscard,.review{margin-top:12px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mood{border:1.5px solid transparent;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:16px;padding:6px 2px 8px;display:grid;justify-items:center;gap:2px;cursor:pointer;font-weight:700;font-size:12.5px}
.mood.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.energy{display:flex;gap:6px;align-items:center}
.en{width:34px;height:14px;border-radius:99px;border:1.5px solid var(--line);background:none;cursor:pointer;padding:0}
.en.on{background:linear-gradient(90deg,#C9F56A,#7CC23A);border-color:transparent}
.mood-tip{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:14px;font-weight:600;line-height:1.45}
.mood-tip svg.i{color:var(--accent);flex:none;margin-top:2px}
.hab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.hab{border:1.5px solid transparent;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:16px;padding:10px 6px 8px;display:grid;justify-items:center;gap:3px;cursor:pointer;text-align:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hab b{font-size:12.5px;line-height:1.2}
.hab>span.hours{font-size:12px;color:var(--muted);font-weight:800}
.hab.done{border-color:var(--ok);background:var(--ok-soft)}
.hab.done>span.hours{color:var(--ok)}
.hab-week{display:flex;gap:3px}
.hab-week i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.hab-week i.on{background:var(--ok)}
.hab-week i.today{outline:1.5px solid var(--accent);outline-offset:1px}
.idea-form{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.idea-form select{max-width:120px}
.ideas-l{display:grid;gap:6px}
.idea-i{display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--surface-2) 70%,transparent);border-radius:12px;padding:6px 6px 6px 10px}
.idea-t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px}
.idea-i.used .idea-t{text-decoration:line-through;color:var(--muted)}
.idea-i .mini-btn{padding:6px 8px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.qlink{display:grid;justify-items:center;gap:4px;text-align:center;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--surface-2) 70%,transparent);border:0;border-radius:16px;padding:10px 6px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--body)}
.qlink.add{color:var(--accent);border:1.5px dashed var(--line);background:none}
.rv-top{display:flex;gap:12px;align-items:center}
.rv-top p{margin:0;font-family:var(--display);font-weight:500;font-size:15px;line-height:1.4}
.rv-bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13.5px;font-weight:700}
.rv-track{display:block;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rv-track>i{display:block;height:100%;border-radius:99px}
.rv-track>i>i{display:block;height:100%;border-radius:99px}

/* work card, level, passport */
.lvl{justify-self:start;display:inline-grid;grid-template-columns:auto auto;gap:2px 8px;align-items:center;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:0;border-radius:14px;padding:6px 10px;cursor:pointer;box-shadow:0 4px 14px rgba(30,27,46,.10);color:#2A2550;font-family:var(--body)}
.lvl-n{font-weight:800;font-size:12px;color:#5B4BDB}
.lvl-t{font-weight:800;font-size:12.5px}
.lvl-bar{grid-column:1/-1;display:block;height:5px;border-radius:99px;background:#E6E3EF;overflow:hidden;width:120px}
.lvl-bar i{display:block;height:100%;background:linear-gradient(90deg,#C9F56A,#7CC23A);border-radius:99px}
.lvl-bar.big{width:100%;height:10px}
.lvl-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lvl-list span,.lvl-list button{font-family:inherit;border:0;cursor:pointer;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.lvl-list span.on,.lvl-list button.on{background:var(--accent-soft);color:var(--accent)}
.workcard{margin-top:12px}
.pulse{display:grid;gap:6px}
.pulse-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pulse-row .tip{font-size:13px}
.hook-box{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 40%,transparent));border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.hook-t{margin:0;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.35;text-wrap:balance}
a.mini-btn{text-decoration:none;color:var(--ink)}
.occ{display:grid;gap:8px}
.occ-i{border:1px solid var(--line);border-radius:16px;padding:8px 10px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.occ-i summary{list-style:none;display:flex;gap:10px;align-items:center;cursor:pointer}
.occ-i summary::-webkit-details-marker{display:none}
.occ-i summary div{display:grid}
.occ-i summary .tip{font-size:12.5px}
.occ-i ul{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:6px;font-size:14px;line-height:1.45}
.occ-i li{display:flex;gap:8px;align-items:baseline}
.passport{margin-top:12px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center;transform:rotate(var(--r));opacity:.55;filter:grayscale(1)}
.stamp.on{opacity:1;filter:none;border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.stamp.now{opacity:1;filter:none;border-color:var(--warn);border-style:dashed}
.stamp-in{display:grid;justify-items:center;gap:1px;text-align:center;padding:4px}
.stamp-in b{font-size:12px;line-height:1.1}
.stamp-in small{font-size:10.5px;color:var(--muted);font-weight:700}
.care-row .glyph-ill{flex:none}

/* city of the day + care */
.city-chip[data-item]{cursor:pointer;border:0;font-family:var(--body)}
.city-chip[data-item]:active{transform:scale(.97)}
.cityday,.care{margin-top:12px}
.cd-head{display:grid;gap:2px}
.cd-time{font-size:13.5px;color:var(--muted);font-weight:600}
.cd-time b{color:var(--ink)}
.cd-fact{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:15px;font-weight:600;line-height:1.5}
.cd-fact svg.i{color:var(--accent);flex:none;margin-top:3px}
.cd-word{display:grid;gap:1px;background:var(--accent-soft);border-radius:16px;padding:10px 14px}
.cd-word b{font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent)}
.cd-word span{font-weight:700}
.cd-word small{color:var(--muted);font-weight:600}
.cd-hist{display:flex;gap:12px;align-items:flex-start}
.cd-year{font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent);flex:none;min-width:52px}
.cd-hist p{margin:2px 0 0;font-size:14px;line-height:1.5}
.care-top{display:flex;gap:10px;align-items:center}
.care-quote{margin:0;font-family:var(--display);font-weight:500;font-size:15px;line-height:1.4;text-wrap:balance}
.care-row{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:10px 12px}
.care-row>svg.i{flex:none;margin-top:2px}
.care-row p{margin:2px 0 6px;font-size:14px;line-height:1.5}
.care-row .mini-btn{margin-top:2px}
.care-row.kid{background:var(--home-soft)}.care-row.kid>svg.i{color:var(--home)}
.care-row.self{background:var(--accent-soft)}.care-row.self>svg.i{color:var(--accent)}
.care-row.home{background:var(--ok-soft)}.care-row.home>svg.i{color:var(--ok)}
.ci-sheet{display:grid;gap:10px;justify-items:start}
.ci-sheet h3{margin:0}
.ci-sheet p{margin:0;line-height:1.6;font-size:15px}

/* cultural code, quotes, badges */
.tabbar-in{grid-template-columns:repeat(6,1fr)!important;gap:0!important}
.tabbar button{font-size:11px!important;padding:6px 0!important}
.tabbar .ico{width:40px!important}
.code-head .row{gap:10px}
.kor{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;margin-top:10px}
.kor .lvl-bar{grid-column:1/-1}

.quote-card blockquote{margin:0;font-family:var(--display);font-weight:600;font-size:18px;line-height:1.4;text-wrap:balance}
.q-a{margin:0;font-weight:800;font-size:14px}
.q-a .tip{font-weight:600}
.code-card{display:grid;gap:10px}
.code-card p{margin:0;line-height:1.6;font-size:15px}
.cc-top{display:flex;gap:12px;align-items:center}
.cc-top h3{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:18px;text-wrap:balance}
.quiz-q{margin:0;font-weight:600;line-height:1.5}
.cat-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.pick-c{flex:none;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px;padding:6px 11px;font-weight:700;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;font-family:var(--body);color:var(--ink)}

.kor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:10px}
.kor-i{border:1.5px dashed var(--line);background:color-mix(in srgb,var(--surface) 75%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:10px 6px;display:grid;justify-items:center;gap:4px;text-align:center;cursor:pointer;font-family:var(--body);color:var(--ink)}
.kor-i svg{filter:grayscale(1);opacity:.5}
.kor-i b{font-size:12px;line-height:1.2}
.kor-i small{font-size:11px;color:var(--muted)}

.kor-i.on svg{filter:none;opacity:1}
.badges{margin-top:12px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{display:grid;justify-items:center;gap:3px;text-align:center;opacity:.5;filter:grayscale(1);background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.medal-c{position:relative}
.par-tog{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.35}.par-tog input{margin-top:2px}
.done-list{margin-top:10px}.done-list summary{cursor:pointer;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center;padding:6px 0}

@keyframes wiggle{0%,100%{transform:none}20%{transform:rotate(6deg)}40%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}80%{transform:rotate(-3deg)}}

/* ---------- constants ---------- */
const STAGES = {

};

const isOwner=()=>!!(settings.owner||(settings.projects||[]).some(p=>p.id==="alpha"));
const userName=()=>settings.name||(isOwner()?"Айдана":"");
const hasKids=()=>settings.kids!==undefined?!!settings.kids:isOwner();
/* ---------- state ---------- */
let allTasks=[], tasks=[];
let settings=structuredClone(DEFAULT_SETTINGS);
let view="today", weekOffset=0, store=null, pendingDel=null;
let mcp=null; let sample=null;
let tasksLoaded=false, settingsLoaded=false, ensuring=false;
const setTasks = arr => { allTasks=arr; tasks=arr.filter(t=>!t.skip); };
function mergeSettings(s){
  const out = Object.assign(structuredClone(DEFAULT_SETTINGS), s||{});
  for (const hp of HOME_PROJECTS) if (!out.projects.some(p=>p.id===hp.id)) out.projects.push(hp);
  out.projects = out.projects.map(p=>{ const d=DEFAULT_SETTINGS.projects.find(x=>x.id===p.id); return d?{...d,...p}:p; });
  return out;
}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const toKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return toKey(d);};
const todayKey=()=>toKey(new Date());
const nice=k=>{const d=fromKey(k);return d.getDate()+" "+MONTHS[d.getMonth()];};
const niceWd=k=>WD[fromKey(k).getDay()]+", "+nice(k);
const fmtH=h=>{const m=Math.round(h*60);const H=Math.floor(m/60),M=m%60;return (H?H+"ч":"")+(M?(H?" ":"")+M+"м":"")||"0ч";};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c;};

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const proj=id=>settings.projects.find(p=>p.id===id)||{name:"Без проекта",color:"--p-other",icon:"task"};
const isHome=t=>!!(STAGES[t.stage]?.home) || proj(t.project).kind==="home";
const workTasks=arr=>arr.filter(t=>!isHome(t));
const dotHtml=id=>`<span class="dot" style="background:var(${proj(id).color})"></span>`;
const tile=(t,cls="tile")=>`<span class="${cls}" style="--pc:var(${proj(t.project).color})">${ic(STAGES[t.stage]?.icon||"task")}</span>`;
const projTile=p=>`<span class="tile" style="--pc:var(${p.color})">${ic(p.icon||"task")}</span>`;
const isPar=t=>t.par===true||(t.par!==false&&(/сторис|репост/i.test(t.title||"")||["stories","repost"].includes(t.stage)));
const load=(k,extra=[])=>workTasks(tasks.concat(extra)).filter(t=>t.date===k&&!isPar(t)).reduce((s,t)=>s+Number(t.hours||0),0);
const sortTasks=arr=>arr.slice().sort((a,b)=>(a.done-b.done)||((a.time||"~")>(b.time||"~")?1:(a.time||"~")<(b.time||"~")?-1:0)||(STAGE_ORDER.indexOf(a.stage)-STAGE_ORDER.indexOf(b.stage))||(a.title>b.title?1:-1));
const uid=()=>"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blockFor=k=>(settings.blocks||[]).find(b=>k>=b.from&&k<=b.to);
const isWorkDay=k=>settings.workdays.includes(fromKey(k).getDay())&&!blockFor(k);
const placesFor=k=>(settings.places||[]).filter(p=>p.days.includes(fromKey(k).getDay()));
const placeLine=(pl,cls="block-line place")=>`<div class="${cls}" style="--pc:var(${proj(pl.project).color})">${ic("pin")}<b>${esc(proj(pl.project).name)}</b>${pl.time?` <span class="hours">${esc(pl.time)}</span>`:""}${pl.note?` · ${esc(pl.note)}`:""}</div>`;
let notes=[];
function setStatus(t){document.getElementById("status").textContent=t;}

/* ---------- recurring ---------- */
async function ensureRecurring(){
  if(!store||!tasksLoaded||!settingsLoaded||ensuring) return;
  ensuring=true;
  try{
    const have=new Set(allTasks.map(t=>t.id)); const start=todayKey();
    for(let i=0;i<14;i++){
      const k=addDays(start,i), wd=fromKey(k).getDay(), blk=blockFor(k);
      for(const tp of (settings.templates||[])){
        if(!tp.days.includes(wd)) continue;
        if(blk&&(tp.skipInBlock||(tp.project===blk.project&&tp.stage==="stories"))) continue;
        const id="r-"+tp.id+"-"+k;
        if(have.has(id)) continue;
        have.add(id);
        await store.saveTask({id,title:tp.title,project:tp.project,stage:tp.stage,date:k,hours:tp.hours,done:false,time:tp.time||"",tpl:tp.id});
      }
    }
  } finally { ensuring=false; }
}

/* ---------- scheduling ---------- */
const STAGE_FLOW=["idea","script","text","shoot","design","edit","post"];
const stH=s=>Number(settings.stageHours?.[s]??STAGES[s]?.h??1);
const parseHM=s=>{const m=String(s||"").match(/(\d{1,2})[:.](\d{2})/);return m?Number(m[1])*60+Number(m[2]):null;};
const fmtHM=m=>pad(Math.floor(m/60)%24)+":"+pad(Math.round(m)%60);
const fmtMin=m=>fmtH(m/60);
const postTime=pid=>settings.postTimes?.[pid]||"";
const effTime=t=>t.time||(t.stage==="post"?postTime(t.project):"");
const sessionMin=t=>t.startedAt?Math.max(0,(Date.now()-Date.parse(t.startedAt))/60000):0;
const spentTotal=t=>(Number(t.spentMin)||0)+sessionMin(t);
const planMin=t=>Math.round(Number(t.hours||0)*60);
function planPiece(publish, stages, project){
  const today=todayKey(); const base=publish<today?today:publish;
  const order=STAGE_FLOW.filter(s=>stages.includes(s));
  const out=[]; let bound=null;
  for(const st of order.slice().reverse()){
    const h=stH(st);
    if(bound===null){out.push({stage:st,date:base,hours:h});bound=base;continue;}
    const pref=settings.stageDay[st]; const cands=[];
    for(let k=addDays(bound,-1);k>=today;k=addDays(k,-1)) cands.push(k);
    const fits=k=>load(k,out)+h<=settings.limit+1e-9;
    const onSite=k=>placesFor(k).some(p=>p.project===project&&p.shoot!==false);
    const sitePick = st==="shoot" && (settings.places||[]).some(p=>p.project===project&&p.shoot!==false) ? (cands.find(k=>onSite(k)&&isWorkDay(k)&&fits(k))||cands.find(k=>onSite(k))) : null;
    const pick=sitePick||cands.find(k=>fromKey(k).getDay()===pref&&isWorkDay(k)&&fits(k))||cands.find(k=>fromKey(k).getDay()===pref&&isWorkDay(k))||cands.find(k=>isWorkDay(k)&&fits(k))||cands[0]||bound;
    out.push({stage:st,date:pick,hours:h}); bound=pick;
  }
  return out.reverse();
}
/* time-blocked day. Planned mode pins every task (done ones too) to the clock from the start of the day,
   so lateness is visible; live mode lays out only what is left, from now, for the "free at" forecast. */
function daySchedule(k,live=false){
  const now=new Date(), isToday=k===todayKey(), nowM=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const ds0=parseHM(settings.dayStart)??600, de=parseHM(settings.dayEnd)??1080;
  const an=settings.dayAnchor, ds=(an&&an.date===k)?an.m:ds0;
  const list=workTasks(tasks).filter(t=>t.date===k&&(live?!t.done:true));
  const dur=t=>live?Math.max(5,planMin(t)-spentTotal(t)):Math.max(5,planMin(t));
  const running=live?list.find(t=>t.startedAt):null;
  const rows=[]; let cur=live?Math.max(ds,isToday?nowM:ds):ds;
  if(running&&isToday){const s=nowM-sessionMin(running);rows.push({t:running,start:s,dur:Math.max(dur(running)+sessionMin(running),sessionMin(running))});cur=Math.max(cur,s+rows[0].dur);}
  const par=list.filter(t=>t!==running&&isPar(t));
  const fixed=list.filter(t=>t!==running&&!isPar(t)&&parseHM(effTime(t))!==null).map(t=>({t,start:parseHM(effTime(t)),dur:dur(t)})).sort((a,b)=>a.start-b.start);
  const pIdx=t=>settings.projects.findIndex(p=>p.id===t.project);
  const flex=sortTasks(list.filter(t=>t!==running&&!isPar(t)&&parseHM(effTime(t))===null)).sort((a,b)=>(b.done-a.done)||((a.due||"9999")>(b.due||"9999")?1:(a.due||"9999")<(b.due||"9999")?-1:0)||(pIdx(a)-pIdx(b)));
  let fi=0;
  for(const t of flex){
    const d=dur(t);
    while(fi<fixed.length&&fixed[fi].start<cur+d){const f=fixed[fi++];rows.push(f);cur=Math.max(cur,f.start+f.dur);}
    rows.push({t,start:cur,dur:d}); cur+=d;
  }
  while(fi<fixed.length) rows.push(fixed[fi++]);
  for(const t of par){const tm=parseHM(effTime(t));rows.push({t,start:tm!==null?tm:(live&&isToday?Math.max(ds,nowM):ds),dur:dur(t),par:true});}
  rows.sort((a,b)=>a.start-b.start);
  const end=rows.reduce((m,r)=>Math.max(m,r.start+r.dur),isToday?nowM:ds);
  return {rows,end,ds,de,nowM,isToday};
}
/* what to ask right now: an overrun, a task whose planned end has passed, or a task whose start has come */
function getCheckin(){
  const k=todayKey(), sch=daySchedule(k); if(!sch.isToday) return null;
  const run=tasks.find(t=>t.startedAt&&t.date===k);
  if(run){const pm=planMin(run),sp=spentTotal(run);if(pm>0&&sp>pm)return {kind:"over",t:run,nowM:sch.nowM};}
  const late=sch.rows.filter(r=>!r.t.done&&!r.t.startedAt&&r.start+r.dur<=sch.nowM);
  if(late.length) return {kind:"late",t:late[0].t,end:late[0].start+late[0].dur,nowM:sch.nowM,lateCount:late.length};
  if(!run){const r=sch.rows.find(r=>!r.t.done&&r.start<=sch.nowM&&r.start+r.dur>sch.nowM);if(r)return {kind:"start",t:r.t,start:r.start,end:r.start+r.dur,nowM:sch.nowM};}
  return null;
}
function checkinHtml(ci,big){
  if(!ci) return "";

function blockGroups(rows){
  const groups=[];
  for(const r of rows){const g=groups[groups.length-1];
    if(g&&g.project===r.t.project&&r.start<=g.end+1){g.rows.push(r);g.end=Math.max(g.end,r.start+r.dur);}
    else groups.push({project:r.t.project,start:r.start,end:r.start+r.dur,rows:[r]});}
  return groups;
}

function renderWeek(){
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const monday=addDays(todayKey(),-dow+weekOffset*7), sunday=addDays(monday,6), tk=todayKey();
  let weekTotal=0, strip="", days="";
  const maxH=Math.max(settings.limit*1.25,...Array.from({length:7},(_,i)=>load(addDays(monday,i))));
  for(let i=0;i<7;i++){
    const k=addDays(monday,i), d=fromKey(k), l=load(k); weekTotal+=l;
    const list=sortTasks(tasks.filter(t=>t.date===k)), blk=blockFor(k);
    const over=l>settings.limit;
    strip+=`<button class="sday ${k===tk?"today":""}" data-jump="d-${k}" aria-label="${WD_FULL[d.getDay()]}: ${fmtH(l)}"><span class="sbar ${over?"over":""}"><i style="height:${l/maxH*100}%"></i><span class="lim" style="bottom:${settings.limit/maxH*100}%"></span></span><span>${WD[d.getDay()]}</span></button>`;
    days+=`<div class="day ${k===tk?"today":""}" id="d-${k}">
      <div class="day-head"><span class="day-name">${WD_FULL[d.getDay()]}<span>${nice(k)}</span></span>
      <span class="pill hours ${over?"over":l===0?"free":""}">${l===0?"свободно":fmtH(l)}</span></div>
      ${blk?`<div class="block-line">${ic("tent")}<b>${esc(blk.title)}</b> ${esc(blk.note||"")}</div>`:""}
      ${placesFor(k).map(pl=>placeLine(pl)).join("")}
      ${list.length?chipsHtml(list):`<span class="tip">Ничего не запланировано</span>`}
    </div>`;
  }
  document.getElementById("view-week").innerHTML=`
    ${weekReview()}
    <div class="weekbar">
      <div class="weeknav"><button class="navbtn" id="wPrev" aria-label="Прошлая неделя">${ic("left")}</button>
      <strong>${nice(monday)} — ${nice(sunday)}<small class="hours">работа: ${fmtH(weekTotal)} · пунктир — твой лимит</small></strong>
      <button class="navbtn" id="wNext" aria-label="Следующая неделя">${ic("right")}</button></div>
      <div class="strip">${strip}</div>
    </div>
    <div class="weeklist">${days}</div>`;
  bindExtras();
  document.getElementById("wPrev").onclick=()=>{weekOffset--;render();};
  document.getElementById("wNext").onclick=()=>{weekOffset++;render();};
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"}));
}

/* ---------- sheets ---------- */
function openSheet(html){document.getElementById("sheetIn").innerHTML=html;if(typeof gxNode==="function")gxNode(document.getElementById("sheetIn"));document.getElementById("sheet").hidden=false;document.getElementById("scrim").hidden=false;}
function closeSheet(){document.getElementById("sheet").hidden=true;document.getElementById("scrim").hidden=true;sheetMode=null;updatePill();}
let sheetMode=null;
document.getElementById("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});
const projPick=(sel,filter)=>settings.projects.filter(filter).map(p=>`<button data-p="${p.id}" aria-pressed="${sel===p.id}">${ic(p.icon||"task")}${esc(p.name)}</button>`).join("");

const STAGE_LABEL={idea:"Придумать",script:"Сценарий",text:"Текст",shoot:"Съёмка",design:"Дизайн",edit:"Монтаж",post:"Выложить"};
function openAdd(){
  const work=settings.projects.filter(p=>p.kind!=="home");
  const st={kind:contentMode()?"content":"task",fmt:"reels",stages:FORMATS.reels.stages.slice(),project:work[0]?.id,date:todayKey(),title:"",hours:1,time:"",end:"",timed:false,note:"",par:false,homeStage:"me",ptime:postTime(work[0]?.id)};
  const span=()=>{const a=parseHM(st.time),b=parseHM(st.end);if(a===null||b===null)return 0;const d=(b-a+1440)%1440;return d||1440;};
  const fixNight=()=>{st.note="";if(!st.timed||st.date!==todayKey())return;const a=parseHM(st.time);if(a===null)return;const n=new Date(),nowM=n.getHours()*60+n.getMinutes();
    if(a<nowM-15&&a<360){const tm=addDays(todayKey(),1);st.date=tm;st.note=gx(`${st.time} сегодня уже прошло — поставила на ночь с ${["воскресенья","понедельника","вторника","среды","четверга","пятницы","субботы"][n.getDay()]} на ${["воскресенье","понедельник","вторник","среду","четверг","пятницу","субботу"][(n.getDay()+1)%7]}.`);}
    else if(a<nowM-15) st.note="Это время сегодня уже прошло. Если имеешь в виду завтра — нажми «Завтра».";};
  const whenLine=()=>{if(!st.timed){return `Без точного времени: BARI сам найдёт место в дне · ${fmtH(st.hours)}`;}const d=span();if(!st.time)return "Выбери, со скольки.";if(!st.end)return `${niceWd(st.date)}, с ${st.time}. Укажи, до скольки.`;const a=parseHM(st.time),cross=a+d>1440;return `${niceWd(st.date)}, ${st.time} → ${st.end}${cross?" (уже следующего дня)":""} · ${fmtH(d/60)}`;};
  const timeBlock=()=>`<div class="field"><span class="label">Время</span>
      <div class="row"><button type="button" class="tog" data-tm="0" aria-pressed="${!st.timed}">Любое</button><button type="button" class="tog" data-tm="1" aria-pressed="${st.timed}">С … до …</button></div>
      ${st.timed?`<div class="row" style="margin-top:8px"><div class="field" style="flex:1"><label class="label" for="aFrom">С</label><input id="aFrom" type="time" value="${esc(st.time)}"></div><div class="field" style="flex:1"><label class="label" for="aTo">До</label><input id="aTo" type="time" value="${esc(st.end)}"></div></div>`
      :`<div class="seg" style="margin-top:8px">${[.5,1,2,3,4].map(h=>`<button type="button" class="mini-btn ${st.hours===h?"on":""}" data-hq="${h}">${h<1?"30 мин":h+" ч"}</button>`).join("")}<input id="aHours" type="number" min="0.25" step="0.25" value="${st.hours}" aria-label="Часов" style="width:80px"></div>`}
      <p class="tip when-line">${esc(whenLine())}</p>${st.note?`<p class="tip when-note">${esc(st.note)}</p>`:""}<label class="par-tog"><input type="checkbox" id="aPar" ${st.par?"checked":""}> Можно делать параллельно с другими делами — не занимает время в плане</label></div>`;
  const dateRow=(label)=>`<div class="field"><label class="label" for="aDate">${label}</label>
      <div class="row"><button type="button" class="tog" data-qd="0" aria-pressed="${st.date===todayKey()}">Сегодня</button><button type="button" class="tog" data-qd="1" aria-pressed="${st.date===addDays(todayKey(),1)}">Завтра</button><input id="aDate" type="date" value="${st.date}" min="${todayKey()}" style="flex:1"></div></div>`;
  const draw=()=>{
    const hasPost=st.stages.includes("post");
    const plan=st.kind==="content"?planPiece(st.date,st.stages,st.project):[];
    let body="";
    if(st.kind==="content"){
      body=`
      <div class="field"><span class="label">Проект</span><div class="pick">${projPick(st.project,p=>p.kind!=="home")}</div></div>
      <div class="field"><span class="label">Формат</span><div class="pick">${Object.entries(FORMATS).map(([k,f])=>`<button data-f="${k}" aria-pressed="${st.fmt===k}">${ic(f.icon)}${f.name}</button>`).join("")}</div></div>
      <div class="field"><span class="label">Что нужно сделать</span>
        <div class="toggles">${FORMATS[st.fmt].stages.map(s=>`<button class="tog" data-stg="${s}" aria-pressed="${st.stages.includes(s)}">${STAGE_LABEL[s]}</button>`).join("")}</div>
        <div class="seg"><button class="mini-btn" data-only="idea">${ic("idea")}Только придумать</button><button class="mini-btn" data-only="post">${ic("send")}Только выложить</button><button class="mini-btn" data-only="all">Все этапы</button></div></div>
      ${dateRow(hasPost?"Дата выхода":"К какому дню")}
      ${hasPost?`<div class="field"><label class="label" for="aPT">Время выкладки</label><input id="aPT" type="time" value="${esc(st.ptime)}" min="${esc(settings.dayStart)}" max="${esc(settings.dayEnd)}"></div>`:""}
      ${plan.length?`<div class="field"><span class="label">Так встанет в план</span><div class="preview">${plan.map(p=>{const over=load(p.date)+p.hours>settings.limit;return `<div class="pv ${over?"over":""}"><span class="tile" style="--pc:var(${proj(st.project).color})">${ic(STAGES[p.stage].icon)}</span><b>${STAGE_LABEL[p.stage]}</b><span class="d">${niceWd(p.date)}${p.stage==="post"&&st.ptime?" в "+esc(st.ptime):""}${over?" · день перегружен":""}</span><span class="hours d" style="margin-left:auto">${fmtH(p.hours)}</span></div>`}).join("")}</div></div>`:`<p class="tip">Выбери хотя бы один этап.</p>`}`;
    } else if(st.kind==="task"){
      body=`
      <div class="field"><span class="label">Проект</span><div class="pick">${projPick(st.project,p=>p.kind!=="home")}</div></div>
      ${dateRow("Какой день")}
      ${timeBlock()}`;
    } else {
      body=`
      <div class="field"><span class="label">Тип</span><div class="pick">${HOME_TPL.map(s=>`<button data-hs="${s}" aria-pressed="${st.homeStage===s}">${ic(STAGES[s].icon)}${STAGES[s].name}</button>`).join("")}</div></div>
      ${dateRow("Какой день")}
      ${timeBlock()}`;
    }
    openSheet(`
      <div class="add-head"><h3>${ic("plus")}Добавить в план</h3><button type="button" class="mini-btn" id="addHelp">? Как записывать</button></div>
      <p class="add-tip">${st.kind==="content"?"Укажи дату выхода и нужные этапы — я разложу их по дням до публикации.":st.kind==="task"?"Пиши действие с результатом: «Отправить КП клиенту», а не «КП». Оцени время честно — большое дело раздели на шаги по 1–2 часа.":"Дела для дома и себя не съедают рабочий лимит. Время укажи, только если оно важно."}</p>
      <div class="pick">${[["content","Контент","film"],["task","Задача","task"],["home","Дом и я","heart"]].filter(x=>x[0]!=="content"||contentMode()).map(([k,n,i])=>`<button data-kind="${k}" aria-pressed="${st.kind===k}">${ic(i)}${n}</button>`).join("")}</div>
      <div class="field"><label class="label" for="aTitle">Название</label><input id="aTitle" type="text" value="${esc(st.title)}" placeholder="${st.kind==="home"?"Например: испечь круассаны":st.kind==="task"?"Например: отправить отчёт директору":"Например: рилс про страх выступления"}"></div>
      ${body}
      <div class="actions"><button class="ghost" id="aCancel">Отмена</button><button class="primary" id="aSave">${ic("check")}Добавить</button></div>`);
    const t=document.getElementById("aTitle"); t.oninput=()=>st.title=t.value;
    const q=(sel,fn)=>document.querySelectorAll("#sheetIn "+sel).forEach(b=>b.onclick=()=>{fn(b);draw();});
    q("[data-kind]",b=>{st.kind=b.dataset.kind;st.hours=st.kind==="home"?STAGES[st.homeStage].h:1;});
    q("[data-p]",b=>{st.project=b.dataset.p;st.ptime=postTime(st.project)||st.ptime;});
    q("[data-f]",b=>{st.fmt=b.dataset.f;st.stages=FORMATS[st.fmt].stages.slice();});
    q("[data-stg]",b=>{const s=b.dataset.stg;st.stages=st.stages.includes(s)?st.stages.filter(x=>x!==s):st.stages.concat(s);});
    q("[data-only]",b=>{const o=b.dataset.only;st.stages=o==="all"?FORMATS[st.fmt].stages.slice():[o];});
    q("[data-hs]",b=>{st.homeStage=b.dataset.hs;st.hours=STAGES[st.homeStage].h;});
    q("[data-qd]",b=>{st.date=addDays(todayKey(),Number(b.dataset.qd));st.note="";});
    q("[data-tm]",b=>{st.timed=b.dataset.tm==="1";if(st.timed&&!st.time){const n=new Date();const m=Math.ceil((n.getHours()*60+n.getMinutes())/30)*30%1440;st.time=hm(m);st.end=hm(m+Math.round(st.hours*60));}fixNight();});
    q("[data-hq]",b=>{st.hours=Number(b.dataset.hq);});
    const apr=document.getElementById("aPar"); if(apr) apr.onchange=()=>{st.par=apr.checked;};
    document.getElementById("aDate").onchange=e=>{if(e.target.value){st.date=e.target.value;st.note="";draw();}};
    const af=document.getElementById("aFrom"); if(af) af.onchange=()=>{const old=span();st.time=af.value;if(old&&parseHM(st.time)!==null)st.end=hm(parseHM(st.time)+old);fixNight();draw();};
    const at=document.getElementById("aTo"); if(at) at.onchange=()=>{st.end=at.value;draw();};
    const pt=document.getElementById("aPT"); if(pt) pt.onchange=()=>{st.ptime=pt.value;draw();};
    const hh=document.getElementById("aHours"); if(hh) hh.oninput=()=>st.hours=Number(hh.value)||1;
    document.getElementById("aCancel").onclick=closeSheet;
    document.getElementById("aSave").onclick=async()=>{
      if(!st.title.trim()){t.focus();t.placeholder="Сначала напиши название";return;}
      if((st.kind==="task"||st.kind==="home")&&st.timed){if(!st.time||!st.end){toast("Укажи, с какого и до какого времени.");return;}st.hours=Math.round(span()/60*100)/100;}else if(st.kind!=="content"){st.time="";}
      const title=st.title.trim(), piece=uid(), date=st.date<todayKey()?todayKey():st.date;
      if(st.kind==="content"){
        const items=planPiece(date,st.stages,st.project); if(!items.length) return;
        closeSheet();
        for(const p of items) await store.saveTask({id:uid(),title,project:st.project,stage:p.stage,date:p.date,hours:p.hours,done:false,publish:st.stages.includes("post")?date:"",piece,time:p.stage==="post"?st.ptime:""});
      } else if(st.kind==="task"){
        closeSheet();
        await store.saveTask({id:uid(),title,project:st.project,stage:"task",date,hours:st.hours,done:false,piece,time:st.time,...(st.par?{par:true}:{}),});
      } else {
        closeSheet();
        const pid=st.homeStage==="read"?"books":st.homeStage==="bake"?"bake":"house";
        await store.saveTask({id:uid(),title,project:pid,stage:st.homeStage,date,hours:st.hours,done:false,piece,time:st.time});
      }
    };
    t.focus();
  };
  draw();
}

function openEdit(id){
  const t0=tasks.find(x=>x.id===id); if(!t0) return;
  const t={...t0}; let confirmDel=false;
  const draw=()=>{
    const cur=tasks.find(x=>x.id===id)||t0, run=!!cur.startedAt, sp=spentTotal(cur), pm=planMin(cur);
    openSheet(`
      <h3>${tile(t)}${STAGES[t.stage]?.name||"Задача"}</h3>
      <div class="field"><label class="label" for="eTitle">Название</label><input id="eTitle" type="text" value="${esc(t.title)}"></div>
      <div class="field"><span class="label">День</span>
        <div class="row"><button class="navbtn" id="eMinus" aria-label="На день раньше">${ic("left")}</button><input id="eDate" type="date" value="${t.date}" style="flex:1"><button class="navbtn" id="ePlus" aria-label="На день позже">${ic("right")}</button></div></div>
      <div class="row">
        <div class="field" style="flex:1;min-width:90px"><label class="label" for="eTime">С</label><input id="eTime" type="time" value="${esc(parseHM(t.time||"")!==null?t.time:"")}"></div>
        <div class="field" style="flex:1;min-width:90px"><label class="label" for="eEnd">До</label><input id="eEnd" type="time" value="${parseHM(t.time||"")!==null?hm(parseHM(t.time)+Math.round(Number(t.hours)*60)):""}"></div>
        <div class="field" style="flex:1;min-width:90px"><label class="label" for="eHours">План, ч</label><input id="eHours" type="number" min="0.25" step="0.25" value="${t.hours}"></div>
        <div class="field" style="flex:1;min-width:90px"><label class="label" for="eSpent">Факт, мин</label><input id="eSpent" type="number" min="0" step="1" value="${Math.round(sp)}"></div>
      </div>
      ${pm>0&&sp>=1?`<p class="tip ${sp>pm?"danger":""}">${sp>pm?`Вышла за план на ${fmtMin(sp-pm)}.`:`До конца плана ${fmtMin(pm-sp)}.`}</p>`:""}
      ${t.publish&&t.stage!=="post"&&t.stage!=="task"?`<p class="tip">Выход контента: ${niceWd(t.publish)}</p>`:""}
      <label class="par-tog"><input type="checkbox" id="ePar" ${isPar(t)?"checked":""}> Параллельно с другими делами</label>
      ${isHome(t)||t.done?"":`<button class="ghost" id="eTrack">${ic(run?"pause":"play")}${run?"Пауза":"Начать сейчас"}</button>`}
      <div class="actions"><button class="ghost danger" id="eDel">${confirmDel?"Точно удалить?":ic("trash")}</button><button class="ghost" id="eCancel">Отмена</button><button class="primary" id="eSave">Сохранить</button></div>`);
    const g=i=>document.getElementById(i);
    g("eTitle").oninput=e=>t.title=e.target.value; g("eDate").onchange=e=>{if(e.target.value)t.date=e.target.value;};
    const syncEnd=()=>{const a=parseHM(t.time||"");g("eEnd").value=a!==null?hm(a+Math.round(Number(t.hours)*60)):"";};
    g("eHours").oninput=e=>{t.hours=Number(e.target.value)||t.hours;syncEnd();}; g("eTime").onchange=e=>{t.time=e.target.value.trim();syncEnd();};
    g("eEnd").onchange=e=>{const a=parseHM(t.time||""),b=parseHM(e.target.value);if(a===null||b===null)return;const d=((b-a+1440)%1440)||1440;t.hours=Math.round(d/60*100)/100;g("eHours").value=t.hours;};
    g("eSpent").oninput=e=>t.spentEdited=Math.max(0,Number(e.target.value)||0);
    g("ePar").onchange=e=>{t.par=e.target.checked;};
    g("eMinus").onclick=()=>{t.date=addDays(t.date,-1);draw();};
    g("ePlus").onclick=()=>{t.date=addDays(t.date,1);draw();};
    g("eCancel").onclick=closeSheet;
    const tr=g("eTrack"); if(tr) tr.onclick=async()=>{closeSheet();const c=tasks.find(x=>x.id===id)||t0;if(c.startedAt) await stopTrack(c); else await startTrack(c);};
    g("eSave").onclick=async()=>{
      closeSheet();
      const c=tasks.find(x=>x.id===id)||t0;
      const out={...t,startedAt:c.startedAt||"",spentMin:Number(c.spentMin)||0};
      if(t.spentEdited!==undefined){out.spentMin=t.spentEdited;if(out.startedAt)out.startedAt=new Date().toISOString();}
      delete out.spentEdited;
      await store.saveTask(out);
    };
    g("eDel").onclick=async()=>{if(!confirmDel){confirmDel=true;draw();return;}closeSheet();await store.deleteTask(t.id);};
  };
  draw();
}

      <div class="row"><div class="field" style="flex:1"><label class="label" for="rHours">Часов</label><input id="rHours" type="number" min="0.25" step="0.25" value="${st.hours}"></div>
      <div class="field" style="flex:1"><label class="label" for="rTime">Время</label><input id="rTime" type="text" value="${esc(st.time)}" placeholder="${home?"вечер":"10:00"}"></div></div>

    document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{st.project=b.dataset.p;draw();});
    document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const d=Number(b.dataset.d);st.days=st.days.includes(d)?st.days.filter(x=>x!==d):st.days.concat(d);draw();});
    document.getElementById("plCancel").onclick=closeSheet;

/* ---------- live tracking ---------- */
const warned=new Set();
function toast(msg){const el=document.getElementById("toast");el.textContent=typeof gx==="function"?gx(msg):msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,4000);}
function updatePill(r=tasks.find(t=>t.startedAt)){
  const pill=document.getElementById("timerPill");
  pill.hidden=!r;
  if(!r) return;
  const sp=spentTotal(r), pm=planMin(r), over=pm>0&&sp>pm;
  const s=Math.floor(sp*60), mm=Math.floor(s/60), ss=s%60;
  pill.classList.toggle("over",over);
  pill.innerHTML=`${ic(over?"timer":"pause")}<span class="pill-t">${esc(r.title)}</span><span class="hours">${pad(mm)}:${pad(ss)} / ${fmtMin(pm)}</span>`;
}
function tickTrack(){
  const r=tasks.find(t=>t.startedAt); updatePill(r);
  if(r){const pm=planMin(r);if(pm>0&&spentTotal(r)>pm&&!warned.has(r.id)){warned.add(r.id);toast(`Время по плану на «${r.title}» вышло. Закругляйся или перенеси остаток.`);try{navigator.vibrate?.(300);}catch(e){}if(view==="today"&&document.getElementById("sheet").hidden)render();}}
}
setInterval(tickTrack,1000);
const asked=new Set();
function proactiveCheck(){
  if(!store) return;
  const ci=getCheckin();
  document.title=ci&&ci.kind!=="start"?"Сделала? · BARI":"BARI";
  if(!ci) return;
  const key=ci.kind+"-"+ci.t.id+"-"+ci.t.hours+"-"+ci.t.date;
  if(asked.has(key)||!document.getElementById("sheet").hidden) return;
  asked.add(key);
  openSheet(checkinHtml(ci,true)+`<button class="ghost" id="ciLater">Спрошу позже</button>`);
  document.querySelectorAll("#sheetIn [data-ci]").forEach(b=>b.onclick=async()=>{closeSheet();await handleCi(b.dataset.ci,b.dataset.id);});
  document.getElementById("ciLater").onclick=closeSheet;
  try{navigator.vibrate?.([200,100,200]);}catch(e){}
}
setInterval(proactiveCheck,30000);
setTimeout(proactiveCheck,4000);
document.getElementById("timerPill").onclick=()=>{const r=tasks.find(t=>t.startedAt);if(r)openEdit(r.id);};

/* BARI's sprout grows with the level: seed → sprout → leaf → shoot → bud → bloom → tree → garden */
function sproutSvg(l,id){
  const stem=(y2)=>`<path d="M99 44 C99 ${36-(44-y2)*0.2} 100 ${y2+8} 102 ${y2}" stroke="#7CC23A" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  const leaves=`<path d="M101 32 C78 36 56 24 50 2 C76 -2 98 12 101 32Z" fill="url(#L${id})"/><path d="M104 30 C112 12 134 6 152 12 C147 30 126 38 104 30Z" fill="url(#L${id})"/><path d="M58 6 C74 12 90 20 99 30" stroke="#E9FFB0" stroke-width="1.6" fill="none" opacity=".7"/>`;
  if(l<=1) return `<ellipse cx="100" cy="40" rx="9" ry="6" fill="#B07A47"/><path d="M95 38 Q100 33 105 38" stroke="#8A5B30" stroke-width="1.4" fill="none"/><path d="M100 34 C100 28 102 25 105 23" stroke="#7CC23A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M104 24 C108 18 115 18 116 20 C112 25 107 26 104 24Z" fill="url(#L${id})"/>`;
  if(l===2) return `${stem(26)}<path d="M101 33 C90 34 80 28 78 18 C90 17 99 24 101 33Z" fill="url(#L${id})"/><path d="M103 30 C108 20 118 16 126 19 C123 28 113 33 103 30Z" fill="url(#L${id})"/>`;
  if(l===3) return stem(18)+leaves;
  if(l===4) return `${stem(18)}${leaves}<path d="M102 20 C96 12 97 3 103 -1 C109 5 108 14 102 20Z" fill="url(#L${id})"/>`;
  if(l===5) return `${stem(18)}${leaves}<path d="M102 20 C95 15 95 4 102 0 C109 4 109 15 102 20Z" fill="#FF8FAB"/><path d="M102 19 C99 13 99 7 102 3" stroke="#E5677D" stroke-width="1.4" fill="none"/>`;
  if(l===6) return `${stem(20)}${leaves}<g transform="translate(102 11)">${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-6.5" rx="5" ry="6.5" fill="#FFB3C7" transform="rotate(${a})"/>`).join("")}<circle r="4.5" fill="#FFD166"/></g>`;
  const crown=`<path d="M100 44 C100 36 101 32 102 26" stroke="#9C6A45" stroke-width="7" fill="none" stroke-linecap="round"/><g fill="url(#L${id})"><circle cx="102" cy="18" r="18"/><circle cx="78" cy="26" r="14"/><circle cx="126" cy="26" r="14"/><circle cx="88" cy="9" r="11"/><circle cx="116" cy="9" r="11"/><circle cx="102" cy="8" r="10"/></g><path d="M88 14 Q95 8 101 11" stroke="#E9FFB0" stroke-width="1.6" fill="none" opacity=".7"/>`;
  if(l===7) return crown;
  return crown+[[86,18,"#E5434D"],[114,8,"#E5434D"],[126,26,"#FFD166"],[96,28,"#FFB3C7"],[102,4,"#FFB3C7"],[76,28,"#FFD166"]].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="3.4" fill="${c}"/>`).join("");
}

function particlesHtml(){

}

function bindExtras(){

  document.querySelectorAll("[data-habit]").forEach(b=>{
    let t; const id=b.dataset.habit, H=habitsList().find(x=>x.id===id);

    b.onpointerup=b.onpointerleave=()=>{if(t){clearTimeout(t);t=null;}};
    b.onclick=()=>{if(b._lp){b._lp=false;return;}const h={...(dayDoc(k).habits||{})},v=h[id]||0;h[id]=H.goal>1?Math.min(H.goal,v+1):(v>=1?0:1);saveDay(k,{habits:h});if(h[id]>=H.goal&&v<H.goal)toast(`${H.name}: готово! ${BARI_DAY[Math.floor(Math.random()*BARI_DAY.length)]}`);};
  });
  const f=document.getElementById("ideaForm");
  if(f) f.onsubmit=async e=>{e.preventDefault();const v=document.getElementById("ideaIn").value.trim();if(!v)return;const id="i"+Date.now().toString(36);

  document.querySelectorAll("[data-iuse]").forEach(b=>b.onclick=()=>{const x=ideas[b.dataset.iuse];store.saveDoc("ideas",b.dataset.iuse,{...x,used:!x.used});});

}



/* motion: respects the phone's «Reduce motion», unless the user asked to bring BARI to life */
function reducedMotion(){try{return matchMedia("(prefers-reduced-motion: reduce)").matches&&settings.motion!=="on";}catch(e){return false;}}
function applyMotionPref(){
  if(settings.motion!=="on"||applyMotionPref.done) return; applyMotionPref.done=true;
  for(const sh of document.styleSheets){let rules;try{rules=sh.cssRules;}catch(e){continue;}
    for(let i=rules.length-1;i>=0;i--){const r=rules[i];if(r.media&&/prefers-reduced-motion/.test(r.media.mediaText)){try{sh.deleteRule(i);}catch(e){}}}}
}
function motionCard(){
  let sys=false;try{sys=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  if(!sys||settings.motion) return "";
  return `<section class="card notif-card"><div class="cc-top">${bari({mood:"sleep",size:54})}<div><span class="label">BARI стоит на месте?</span><p style="margin:2px 0 0;font-size:14px;line-height:1.45">На телефоне включено «Уменьшение движения», поэтому все анимации выключены. Могу всё равно оживить BARI и город — только в этом приложении.</p></div></div>
    <div class="row" style="margin-top:8px;display:flex;gap:8px"><button class="primary" data-motion="on">${ic("spark")}Оживить BARI</button><button class="ghost" data-motion="off">Оставить так</button></div></section>`;
}
document.addEventListener("click",e=>{const b=e.target.closest?.("[data-motion]");if(!b)return;const v=b.dataset.motion;store.saveSettings({...settings,motion:v});if(v==="on"){applyMotionPref();toast("BARI ожил! 🎉");}});

/* ---------- splash: BARI sprouts when the app opens ---------- */
function helloSound(){if(window._helloArm)return;window._helloArm=1;
  const play=()=>{if(window._hello)return;window._hello=1;try{const c=ac();if(c&&c.state!=="running")c.resume();}catch(e){}setTimeout(()=>sfx("hello"),80);};
  try{const c=ac(); if(c&&c.state==="running"){play();return;}}catch(e){}
  // browsers allow sound only after the first touch, so BARI says hello on it
  const h=()=>{document.removeEventListener("pointerdown",h,true);document.removeEventListener("keydown",h,true);play();};
  document.addEventListener("pointerdown",h,true);document.addEventListener("keydown",h,true);}
function showSplash(){
  try{if(sessionStorage.getItem("bari-splash"))return;sessionStorage.setItem("bari-splash","1");}catch(e){}
  if(reducedMotion()) return;
  const hr=new Date().getHours(), j=journeyFor(todayKey()), lg=localGreet(j.lang,hr), night=hr<6||hr>=21;
  const el=document.createElement("div"); el.id="splash"; el.className=night?"night":"";
  el.innerHTML=`<div class="sp-sky">${night?Array.from({length:14},(_,i)=>`<i style="left:${(i*37)%100}%;top:${(i*53)%60}%;animation-delay:${(i%5)*.2}s"></i>`).join(""):""}</div>
    <div class="sp-stage"><div class="sp-seed"></div><div class="sp-bari">${bari({mood:"joy",wave:true,size:150,prop:PROPS.spark})}</div><div class="sp-ground"></div></div>
    <div class="sp-text"><b>BARI</b><span>${esc(lg.text)}${flag(j.country,22)?` ${flag(j.country,22)}`:""}</span></div>`;
  document.body.appendChild(el);
  const done=()=>{el.classList.add("out");setTimeout(()=>el.remove(),500);};
  el.onclick=done; setTimeout(done,2300);
}
