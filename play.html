.gift .lid{position:absolute;left:5px;right:5px;top:30px;height:34px;background:#F06A45;border-radius:8px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.gift .rib{position:absolute;left:50%;width:22px;margin-left:-11px;top:30px;bottom:0;background:#FFD166}
.gift .bow{position:absolute;left:50%;top:6px;width:60px;margin-left:-30px;height:30px;transition:transform .6s}
.gift .bow:before,.gift .bow:after{content:"";position:absolute;top:0;width:28px;height:26px;border:7px solid #FFD166;border-radius:50% 50% 0 50%}
.gift .bow:before{left:0;transform:rotate(-20deg)}.gift .bow:after{right:0;transform:rotate(110deg)}
.gift.open{animation:none}.gift.open .lid,.gift.open .bow{transform:translateY(-70px) rotate(-18deg)}

const myToken=k=>{let t=LS.get("bari-play-tok-"+k);if(!t){t=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");LS.set("bari-play-tok-"+k,t);}return t;};
let WKEY="bari-play-wish", LIVE=null;
const wlHtml=(w,fresh)=>w.items.length?`<p class="muted" style="font-size:13px;margin:8px 0 2px">В списке: ${w.items.length}</p>`+w.items.map((it,i)=>`<div class="it ${fresh===i?"fresh":""}"><div><b>${esc(it.t)}</b>${it.p?` · ${esc(it.p)}`:""}${it.u?`<br><a href="${esc(it.u)}" target="_blank" rel="noopener">ссылка</a>`:""}</div><button class="x" data-d="${i}" aria-label="Удалить">✕</button></div>`).join(""):`<p class="muted" style="font-size:13px">Список пока пуст — добавь первое желание.</p>`;
function toast(t){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);}el.textContent=t;el.classList.remove("on");void el.offsetWidth;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2200);}
function pop(){try{const C=window.AudioContext||window.webkitAudioContext,a=toast.ac||(toast.ac=new C()),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(420,a.currentTime);o.frequency.exponentialRampToValueAtTime(980,a.currentTime+.08);g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.2,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.15);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.2);}catch(e){}}
const wishEditor=name=>{const w=LS.get(WKEY)||{n:name||"",wish:"",items:[]};
  return `<div class="card"><span class="label">Мой вишлист</span><p class="muted">${LIVE?"Пиши, что тебе правда хочется. Твой тайный человек увидит список сразу — и всё, что ты добавишь завтра, тоже.":"Напиши, что тебе правда хочется, и отправь ссылку в общий чат — твоему тайному человеку будет легче."}</p><p class="muted" id="wsync" style="font-size:12.5px"></p>
  <input id="wn" placeholder="Твоё имя" value="${esc(w.n)}"><textarea id="ww" rows="2" placeholder="Главное желание">${esc(w.wish)}</textarea>
  <div id="wl">${wlHtml(w)}</div>
  <input id="wt" placeholder="Что хочется"><input id="wp" placeholder="Цена (необязательно)"><input id="wu" placeholder="Ссылка (необязательно)">
  <button class="ghost" id="wa">+ Добавить</button>${LIVE?"":`<button id="ws">Отправить вишлист</button>`}</div>`;};
function pushWish(w){if(!LIVE)return;const s=$("#wsync");if(s)s.textContent="Сохраняю…";
  rpc("set_wish",{p_game:LIVE.game,p_person:LIVE.me,p_token:LIVE.tok,p_data:{n:w.n,wish:w.wish,items:w.items}}).then(ok=>{const s=$("#wsync");if(s)s.textContent=ok?"✓ Сохранено — твой тайный человек это видит":"Этот вишлист уже ведётся с другого телефона. Открой ссылку там.";}).catch(()=>{const s=$("#wsync");if(s)s.textContent="Сохранено на телефоне. Живой вишлист включится, когда организатор его подключит.";});}
function bindWish(){const save=()=>{const w=LS.get(WKEY)||{items:[]};w.n=$("#wn").value.trim();w.wish=$("#ww").value.trim();LS.set(WKEY,w);return w;};
  $("#ww").onchange=()=>pushWish(save());
  const draw=fresh=>{const w=LS.get(WKEY)||{items:[]};$("#wl").innerHTML=wlHtml(w,fresh);bindDel();};
  const bindDel=()=>document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const w=save(),gone=w.items[+b.dataset.d];w.items.splice(+b.dataset.d,1);LS.set(WKEY,w);pushWish(w);draw();toast("Удалено: "+(gone?gone.t:""));});
  bindDel();
  $("#wa").onclick=()=>{const w=save(),t=$("#wt").value.trim();if(!t){$("#wt").focus();toast("Сначала напиши, что хочется ✍️");return;}const u=$("#wu").value.trim();
    w.items.push({t,p:$("#wp").value.trim(),u:/^https?:\/\//.test(u)?u:""});LS.set(WKEY,w);pushWish(w);draw(w.items.length-1);
    $("#wt").value="";$("#wp").value="";$("#wu").value="";pop();toast("✓ Добавлено в вишлист");
    const f=document.querySelector("#wl .fresh");if(f)f.scrollIntoView({block:"center",behavior:"smooth"});};
  $("#wt").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#wa").click();}});
  if($("#ws")) $("#ws").onclick=()=>{const w=save();if(!w.wish&&!w.items.length){$("#wt").focus();return;}share(`Мой вишлист ${w.n?"("+w.n+") ":""}🎁`,base+"#w="+enc({n:w.n,wish:w.wish,items:w.items}));};}
function game(g){const gk=gameKey(g); LIVE={game:gk,me:norm(g.me),tok:myToken(gk+"|"+norm(g.me))}; WKEY="bari-play-wish-"+gk;
  const T=GAMES[g.t]||GAMES.ayaz, key="bari-play-open-"+enc([g.ti,g.me]).slice(0,40), opened=!!LS.get(key);
  app.innerHTML=`<div class="bari">${BJ}</div><span class="label">${T.e} ${esc(T.n)}</span><h1>${esc(g.ti)}</h1>
  <p class="muted">${esc(g.me)}, ${g.org?esc(g.org)+" позвала тебя в игру":"тебя позвали в игру"}.${g.d?` День игры — ${esc(nice(g.d))}.`:""}${g.b?` ${g.t==="ayaz"?"Бюджет":"Формат"}: ${esc(g.b)}.`:""}</p>
  <div class="card" style="text-align:center"><p class="muted" id="hint">${opened?"Твой тайный человек:":"Нажми на подарок — там тайна только для тебя. Убедись, что никто не подглядывает!"}</p>
  <div class="gift ${opened?"open":""}" id="gift" role="button" aria-label="Открыть"><div class="box"></div><div class="rib"></div><div class="lid"></div><div class="bow"></div></div>
  <div class="who ${opened?"on":""}" id="who">${esc(g.to)}</div><p class="muted" id="verb" style="${opened?"":"display:none"}">Ты ${esc(T.verb)} этому человеку. Тсс — никому!</p></div>
  <div class="card" id="theirWish" style="${opened?"":"display:none"}"><span class="label">Вишлист: ${esc(g.to)}</span><div id="twBody"><p class="muted">Загружаю…</p></div></div>
  ${g.no?`<div class="card"><span class="label">Пожелание организатора</span><p>${esc(g.no)}</p></div>`:""}
  <div class="card"><span class="label">Правила</span><ol>${T.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ol></div>
  ${wishEditor(g.me)}
  <footer><a href="./">BARI — планер и путешествия каждый день</a></footer>`;
  $("#gift").onclick=()=>{if($("#gift").classList.contains("open"))return;$("#gift").classList.add("open");$("#who").classList.add("on");$("#verb").style.display="";$("#hint").textContent="Твой тайный человек:";LS.set(key,1);confetti();chime();$("#theirWish").style.display="";loadTheirs(g,gk);};
  bindWish(); if(opened) loadTheirs(g,gk);
  clearInterval(window._twT); window._twT=setInterval(()=>{if(!document.hidden&&$("#gift")&&$("#gift").classList.contains("open"))loadTheirs(g,gk);},20000);}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&window._twG&&$("#gift")&&$("#gift").classList.contains("open"))loadTheirs(window._twG[0],window._twG[1]);});
async function loadTheirs(g,gk){window._twG=[g,gk];const box=$("#twBody");if(!box)return;
  try{const r=await rpc("get_wish",{p_game:gk,p_person:norm(g.to)});const w=r&&r.data;
    if(!w||(!w.wish&&!(w.items||[]).length)){box.innerHTML=`<p class="muted">${esc(g.to)} ещё не написал(а) вишлист. Загляни позже — список появится здесь сам.</p>`;return;}
    const at=r.at?new Date(r.at).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
    box.innerHTML=`${w.wish?`<p style="font-size:17px;font-weight:700;margin:4px 0">${esc(w.wish)}</p>`:""}${(w.items||[]).map(it=>`<div class="it"><div><b>${esc(it.t)}</b>${it.p?` · ${esc(it.p)}`:""}${it.u?`<br><a href="${esc(it.u)}" target="_blank" rel="noopener">посмотреть</a>`:""}</div></div>`).join("")}${at?`<p class="muted" style="font-size:12px">обновлено ${esc(at)}</p>`:""}`;
  }catch(e){box.innerHTML=`<p class="muted">Живой вишлист скоро заработает. А пока попроси ${esc(g.to)} отправить вишлист в общий чат.</p>`;}}
function wish(w){LIVE=null;app.innerHTML=`<div class="bari">${BH}</div><span class="label">Вишлист</span><h1>${esc(w.n||"Друг")} мечтает о…</h1>
  ${w.wish?`<div class="card"><span class="label">Главное желание</span><p style="font-size:18px;font-weight:700;margin:4px 0">${esc(w.wish)}</p></div>`:""}
  <div class="card">${(w.items||[]).map(it=>`<div class="it"><div><b>${esc(it.t)}</b>${it.p?` · ${esc(it.p)}`:""}${it.u?`<br><a href="${esc(it.u)}" target="_blank" rel="noopener">посмотреть</a>`:""}${it.no?`<br><span class="muted">${esc(it.no)}</span>`:""}</div></div>`).join("")||`<p class="muted">Список пока пуст.</p>`}</div>
  <a class="btn ghost" href="${base}#new">Создать свой вишлист</a><footer><a href="./">BARI — планер и путешествия каждый день</a></footer>`;}
function home(){LIVE=null;WKEY="bari-play-wish";app.innerHTML=`<div class="bari">${BJ}</div><h1>Праздники с близкими</h1><p class="muted">Здесь открываются тайные игры и вишлисты из BARI.</p>${wishEditor("")}<footer><a href="./">Открыть BARI</a></footer>`;bindWish();}
function route(){const h=location.hash.slice(1);if(h.startsWith("g=")){const g=dec(h.slice(2));if(g&&g.me&&g.to)return game(g);}if(h.startsWith("w=")){const w=dec(h.slice(2));if(w)return wish(w);}home();}
window.addEventListener("hashchange",route);route();
})();
</script></body></html>
